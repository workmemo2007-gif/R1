<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة جداً لتوضيح الكارت */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        /* تصميم كارت الزجاج بأقصى درجة شفافية */
        .glass-card {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 380px;
            padding: 16px;
            margin-top: 4vh; 
            border-radius: 28px;
            
            /* أقصى درجات الشفافية (0.02) مع تمويه زجاجي كريستالي */
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px) saturate(200%);
            -webkit-backdrop-filter: blur(12px) saturate(200%);
            
            /* حدود بيضاء رفيعة جداً ومتوهجة */
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .glass-card:hover {
            transform: translateY(-6px) scale(1.01);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.5),
                inset 0 0 25px rgba(255, 255, 255, 0.15);
        }

        /* غلاف مستطيل أعلى الكارت */
        .card-cover {
            width: 100%;
            height: 140px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .user-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* تحسين خط النصوص وطريقة العرض */
        .typing-container {
            padding: 0 8px;
            min-height: 100px;
        }

        .typing-text {
            font-family: 'Amiri', serif; /* خط أميري للرسائل الفاخرة */
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.8;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
            text-align: right;
            border-left: 2px solid #ffffff;
            white-space: pre-wrap;
            display: inline;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffffff; }
        }

        /* زر زجاجي متناسق شفاف جداً */
        .glass-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/workmemo2007-gif/R1/0d60df8b2327c8cb790f747c425956b407036370/lv_0_%D9%A2%D9%A0%D9%A2%D9%A6%D9%A0%D9%A9%D9%A2%D9%A2%D9%A2%D9%A1%D9%A3%D9%A5%D9%A1%D9%A4.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="overlay"></div>

    <div class="glass-card">
        <div class="card-cover">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop" alt="غلاف القصر" class="cover-img">
        </div>

        <div class="card-header">
            <img src="https://via.placeholder.com/60" alt="صورة المستلم" class="user-img">
            <h1 class="card-title">رسالة خاصة</h1>
        </div>
        
        <div class="typing-container">
            <span class="typing-text" id="typewriter"></span>
        </div>

        <button class="glass-btn">عرض التفاصيل</button>
    </div>

    <script>
        const text = "أهلاً بالعلوية رتاج، هناك هدية بانتظارك، ولكن حتى تصلين إلى الهدية يجب اجتياز ثلاث مراحل صعبة وخيرة حتى تصل الأميرة إلى قصرها...";
        let index = 0;
        const speed = 45; 

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        window.onload = typeWriter;
    </script>
</body>
</html>
