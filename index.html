<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى علويتي رتاج | رسالة حب وعزلة</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery (مطلوب لتأثير تموجات الماء) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- jQuery Ripples Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1a0f13;
            overflow-x: hidden;
        }

        /* خلفية الصورة مع تظليل خفيف لدمج التصميم */
        #water-background {
            position: fixed;
            inset: 0;
            background-image: url('image.png'); /* رابط الصورة المرسلة */
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        /* طبقة إضاءة لامعة متحركة فوق الخلفية */
        .shimmer-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 182, 193, 0.15), rgba(0, 0, 0, 0.65));
            pointer-events: none;
            z-index: 1;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(30, 15, 22, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 192, 203, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        inset 0 0 20px rgba(255, 255, 255, 0.03);
        }

        /* Floating Card Animation */
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .floating-container {
            animation: cardFloat 6s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(20, 10, 15, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 192, 203, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 192, 203, 0.4);
        }

        /* Blinking Cursor for Typing Effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #f472b6;
            margin-right: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Heart Beat & Floating Particles Animation */
        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .heart-beat {
            animation: heartPulse 0.6s ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
        }
        .floating-heart {
            position: absolute;
            color: #f43f5e;
            pointer-events: none;
            animation: floatUp 1.2s forwards ease-out;
            z-index: 30;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center relative p-4 sm:p-6 lg:p-8">

    <!-- خلفية الصورة مع تأثير الماء (Water Ripple Target) -->
    <div id="water-background"></div>
    <!-- طبقة إضاءة وتوهج لامع فوق الخلفية -->
    <div class="shimmer-overlay"></div>

    <!-- زر التحكم بالموسيقى الهادئة في الخلفية -->
    <div class="absolute top-6 left-6 z-20">
        <button id="musicToggle" class="glass-card px-4 py-2.5 rounded-full text-xs sm:text-sm font-medium flex items-center gap-2 hover:bg-white/10 transition-all cursor-pointer shadow-lg group">
            <i class="fa-solid fa-music text-pink-400 group-hover:scale-110 transition-transform"></i>
            <span id="musicText">تشغيل أجواء هادئة</span>
        </button>
    </div>

    <!-- الحاوية الرئيسية للبطاقة الزجاجية -->
    <main class="relative z-20 w-full max-w-2xl mx-auto floating-container my-8">
        
        <!-- شاشة اللغز وقفل الرسالة -->
        <div id="lockScreen" class="glass-card rounded-3xl p-8 sm:p-12 text-center shadow-2xl relative overflow-hidden border border-white/10 transition-all duration-500">
            <div class="w-16 h-16 bg-pink-500/10 border border-pink-500/20 rounded-2xl mx-auto flex items-center justify-center text-pink-400 text-2xl mb-6 shadow-inner">
                <i class="fa-solid fa-lock" id="lockIcon"></i>
            </div>
            
            <span class="text-xs uppercase tracking-widest text-pink-400 font-semibold bg-pink-500/10 px-3 py-1 rounded-full border border-pink-500/20">رسالة محمية بالعزلة</span>
            <h2 class="text-2xl sm:text-3xl font-black mt-4 mb-2 text-white">إلى علويتي</h2>
            <p class="text-slate-300 text-sm sm:text-base max-w-md mx-auto mb-8 font-light leading-relaxed">
                لكي تفتح هذه الرسالة المقدسة، يرجى حل اللغز التالي:<br>
                <span class="text-pink-300 font-medium block mt-2">"من هي التي سكنت قلب مؤتمن سامي وأصبحت ملاذه وعزويته؟ (اسم مكون من 4 أحرف)"</span>
            </p>

            <div class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto" id="puzzleForm">
                <input type="text" id="puzzleInput" placeholder="اكتب الإجابة هنا..." class="flex-1 glass-card bg-black/40 border border-white/15 px-4 py-3 rounded-2xl text-white placeholder-slate-400 text-sm focus:outline-none focus:border-pink-400 transition-all text-center sm:text-right">
                <button id="unlockBtn" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-700 hover:to-rose-700 text-white font-medium px-6 py-3 rounded-2xl shadow-lg shadow-pink-500/25 transition-all transform hover:scale-105 active:scale-95 cursor-pointer text-sm">
                    افتح الرسالة <i class="fa-solid fa-key mr-1"></i>
                </button>
            </div>
            <p id="errorMsg" class="text-rose-400 text-xs mt-3 hidden"></p>
        </div>

        <!-- محتوى الرسالة الفعلية (مخفي لحين حل اللغز) -->
        <div class="glass-card rounded-3xl p-6 sm:p-10 lg:p-12 shadow-2xl relative overflow-hidden border border-white/10 hidden opacity-0 transition-all duration-700" id="mainCard">
            
            <!-- تأثير ضوء الماوس التفاعلي على البطاقة -->
            <div id="spotlight" class="absolute pointer-events-none transition-opacity duration-300 opacity-0 -inset-px rounded-3xl z-0" style="background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(244, 114, 182, 0.1), transparent 40%);"></div>

            <!-- رأس الرسالة (Metadata) -->
            <div class="relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-white/10 pb-6 mb-6 gap-4">
                <div>
                    <span class="text-xs uppercase tracking-widest text-pink-400 font-semibold bg-pink-500/10 px-3 py-1 rounded-full border border-pink-500/20">رسالة خاصة وعزلة مقدسة</span>
                    <h1 class="text-2xl sm:text-3xl font-black mt-2 text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-pink-200">
                        إلى علويتي رتاج
                    </h1>
                </div>
                <div class="text-left sm:text-right">
                    <span class="text-xs text-slate-400 block">المرسل:</span>
                    <span class="text-sm font-bold text-pink-300 tracking-wide">مؤتمن سامي</span>
                </div>
            </div>

            <!-- محتوى الرسالة مع تأثير الكتابة السينمائية -->
            <div class="relative z-10 min-h-[220px] sm:min-h-[200px] mb-8">
                <div id="messageText" class="text-slate-200 text-base sm:text-lg leading-relaxed font-light whitespace-pre-line typing-cursor">
                    <!-- سيتم حقن النص هنا بعد حل اللغز -->
                </div>
            </div>

            <!-- لوحة التحكم السفلية (أزرار التفاعل) -->
            <div class="relative z-10 flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-white/10">
                
                <!-- زر إعادة تشغيل النص -->
                <div class="flex items-center gap-2">
                    <button id="replayBtn" title="إعادة قراءة الرسالة" class="glass-card w-10 h-10 rounded-full flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/15 transition-all cursor-pointer">
                        <i class="fa-solid fa-rotate-right text-xs"></i>
                    </button>
                    <span class="text-xs text-slate-400 hidden sm:inline">أو انقر للإعادة</span>
                </div>

                <!-- زر الإعجاب والقلب النابض مع تناثر القلوب -->
                <div class="relative">
                    <button id="heartBtn" class="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-medium px-6 py-3 rounded-full shadow-lg shadow-rose-500/25 flex items-center gap-2.5 transition-all transform hover:scale-105 active:scale-95 cursor-pointer">
                        <i id="heartIcon" class="fa-solid fa-heart text-white"></i>
                        <span class="text-sm tracking-wide">نبضة حب لروحك</span>
                        <span id="likeCount" class="bg-white/20 px-2 py-0.5 rounded-full text-xs font-bold">14</span>
                    </button>
                    <div id="heartsContainer" class="absolute inset-0 pointer-events-none overflow-visible"></div>
                </div>

            </div>

        </div>
    </main>

    <!-- حقوق الطبع والنشر -->
    <footer class="fixed bottom-3 right-0 left-0 text-center z-20 pointer-events-none">
        <p class="text-[11px] text-pink-300/60 tracking-wider">صُنِع بحب وعزلة لأجل رتاج بواسطة مؤتمن سامي © 2026</p>
    </footer>

    <!-- ملف الجافاسكريبت التفاعلي -->
    <script>
        // تفعيل تأثير تموجات الماء على الخلفية باستخدام مكتبة jQuery Ripples
        $(document).ready(function() {$('#water-background').ripples({
                resolution: 512,
                dropRadius: 20,
                perturbance: 0.04,
            });
        });

        const messageContent = `في خضم صخب هذا العالم وضوضائه، حيث تتسارع الأيام وتتكدس الوجوه، أجد في عزلي معكِ -رغم المسافات أو تفاصيل الحضور- وطناً خالصاً لا يشبهه مكان. 

أنتِ لستِ فقط حضوراً عابراً في أيامي، بل إشراقة هادئة تُعيد ترتيب فوضى روحي. فيكِ أكتشف معنى السكينة الحقيقية؛ عزلتي معكِ هي امتلاء لا نقص فيه، خلوة مقدسة أهرب فيها من ضجيج الكون لأستقر في عمق عينيْكِ ودفء روحكِ.

يا علويتي رتاج، دمتِ لي الملاذ، والنبض الذي يمنح لكل تفصيل صغير في حياتي طعماً آخر، أعمق وأجمل.`;

        const lockScreen = document.getElementById('lockScreen');
        const mainCard = document.getElementById('mainCard');
        const puzzleInput = document.getElementById('puzzleInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');
        const lockIcon = document.getElementById('lockIcon');

        const messageEl = document.getElementById('messageText');
        const replayBtn = document.getElementById('replayBtn');
        const heartBtn = document.getElementById('heartBtn');
        const heartIcon = document.getElementById('heartIcon');
        const likeCountEl = document.getElementById('likeCount');
        const heartsContainer = document.getElementById('heartsContainer');
        const spotlight = document.getElementById('spotlight');

        let charIndex = 0;
        let isTyping = false;
        let typingTimeout = null;

        // التحقق من حل اللغز
        function checkPuzzle() {
            const userAnswer = puzzleInput.value.trim().toLowerCase();
            const correctAnswers = ['رتاج', 'ريتاج'];

            if (correctAnswers.includes(userAnswer)) {
                lockIcon.classList.remove('fa-lock');
                lockIcon.classList.add('fa-unlock', 'text-emerald-400');
                
                lockScreen.style.transform = 'scale(0.95)';
                lockScreen.style.opacity = '0';
                
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    mainCard.classList.remove('hidden');
                    setTimeout(() => {
                        mainCard.style.opacity = '1';
                        startTyping();
                    }, 50);
                }, 400);

            } else {
                puzzleInput.classList.add('shake', 'border-rose-500');
                errorMsg.textContent = 'إجابة غير صحيحة، ركزي قليلاً يا علويتي!';
                errorMsg.classList.remove('hidden');
                
                setTimeout(() => {
                    puzzleInput.classList.remove('shake');
                }, 400);
            }
        }

        unlockBtn.addEventListener('click', checkPuzzle);
        puzzleInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPuzzle();
            }
        });

        // دالة الكتابة السينمائية حرفاً حرفاً
        function startTyping() {
            if (isTyping) return;
            isTyping = true;
            messageEl.textContent = '';
            charIndex = 0;
            
            function type() {
                if (charIndex < messageContent.length) {
                    messageEl.textContent += messageContent.charAt(charIndex);
                    charIndex++;
                    let speed = 35;
                    if (messageContent.charAt(charIndex - 1) === '.' || messageContent.charAt(charIndex - 1) === '،') {
                        speed = 120;
                    }
                    typingTimeout = setTimeout(type, speed);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        replayBtn.addEventListener('click', () => {
            clearTimeout(typingTimeout);
            startTyping();
        });

        // تأثير Spotlight المتبع للماوس على البطاقة الزجاجية
        mainCard.addEventListener('mousemove', (e) => {
            const rect = mainCard.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            spotlight.style.setProperty('--mouse-x', `${x}px`);
            spotlight.style.setProperty('--mouse-y', `${y}px`);
            spotlight.style.opacity = '1';
        });

        mainCard.addEventListener('mouseleave', () => {
            spotlight.style.opacity = '0';
        });

        // تفاعل زر الإعجاب وتناثر القلوب
        let likes = 14;
        heartBtn.addEventListener('click', () => {
            likes++;
            likeCountEl.textContent = likes;

            heartIcon.classList.add('heart-beat');
            setTimeout(() => {
                heartIcon.classList.remove('heart-beat');
            }, 600);

            for (let i = 0; i < 5; i++) {
                createFloatingHeart();
            }
        });

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
            heart.classList.add('floating-heart');
            
            const randomX = Math.random() * 60 - 30;
            heart.style.left = `calc(50% + ${randomX}px)`;
            heart.style.bottom = '20px';
            
            const size = Math.random() * 10 + 12;
            heart.style.fontSize = `${size}px`;
            
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1200);
        }

        // نظام محاكاة أصوات بيئية هادئة
        let audioCtx = null;
        let isMusicPlaying = false;
        let oscillatorInterval = null;

        const musicToggle = document.getElementById('musicToggle');
        const musicText = document.getElementById('musicText');

        musicToggle.addEventListener('click', () => {
            if (!isMusicPlaying) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    playAmbientChord();
                    oscillatorInterval = setInterval(playAmbientChord, 6000);
                    
                    isMusicPlaying = true;
                    musicText.textContent = 'إيقاف الأجواء';
                    musicToggle.classList.add('bg-pink-500/20', 'border-pink-500/40');
                } catch (e) {
                    console.log("Audio Context not supported");
                }
            } else {
                if (audioCtx) {
                    audioCtx.close();
                }
                clearInterval(oscillatorInterval);
                isMusicPlaying = false;
                musicText.textContent = 'تشغيل أجواء هادئة';
                musicToggle.classList.remove('bg-pink-500/20', 'border-pink-500/40');
            }
        });

        function playAmbientChord() {
            if (!audioCtx || audioCtx.state === 'closed') return;
            
            const frequencies = [220, 277.18, 329.63, 440];
            frequencies.forEach((freq, index) => {
                setTimeout(() => {
                    if (!audioCtx || audioCtx.state === 'closed') return;
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 1.5);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 5.5);

                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 5.5);
                }, index * 400);
            });
        }
    </script>
</body>
</html>
