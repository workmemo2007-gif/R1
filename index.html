<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية والألغاز - علويتي رتاج</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            user-select: none;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        /* حاوية المغلف الوردي الشفاف */
        .envelope-wrapper {
            position: relative;
            z-index: 3;
            width: 220px;
            height: 130px;
            background-color: rgba(255, 182, 193, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 192, 203, 0.35);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.25);
            margin-top: 100px;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.8s ease, background 0.8s ease, border-color 0.8s ease;
        }

        /* غطاء المغلف العلوي */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-top: 70px solid rgba(255, 182, 193, 0.4);
            transform-origin: top;
            transition: transform 0.6s ease 0.2s, z-index 0.2s ease 0.4s, opacity 0.8s ease;
            z-index: 5;
        }

        /* جيب المغلف السفلي */
        .envelope-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid rgba(255, 182, 193, 0.25);
            border-right: 110px solid rgba(255, 182, 193, 0.25);
            border-bottom: 65px solid rgba(255, 182, 193, 0.35);
            border-radius: 0 0 12px 12px;
            z-index: 4;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        /* تصميم كارت الزجاج المصغر */
        .glass-card {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            padding: 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px) saturate(160%);
            -webkit-backdrop-filter: blur(10px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            z-index: 3;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.6s ease,
                        background 0.3s ease;
        }

        /* انيميشن فتح المغلف */
        .envelope-wrapper.open::before {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .envelope-wrapper.open .glass-card {
            opacity: 1;
            transform: translateX(-50%) translateY(-20px);
            z-index: 6;
        }

        /* مرحلة انبثاق الكارت للأمام واختفاء الظرف */
        .envelope-wrapper.hide-envelope {
            background-color: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .envelope-wrapper.hide-envelope::before,
        .envelope-wrapper.hide-envelope::after {
            opacity: 0;
        }

        .envelope-wrapper.hide-envelope .glass-card {
            transform: translateX(-50%) translateY(10px) scale(1.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            background: rgba(255, 255, 255, 0.08);
        }

        /* غلاف الكارت */
        .card-cover {
            width: 100%;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .typing-container {
            padding: 0 2px;
            min-height: 38px;
        }

        .typing-text {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.52rem;
            font-weight: 500;
            line-height: 1.35;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 2px;
            text-align: right;
            border-left: 1.5px solid #ffffff;
            white-space: pre-wrap;
            display: inline;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffffff; }
        }

        .games-container {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 8px;
        }

        .small-btn {
            flex: 1;
            padding: 5px 0;
            font-size: 0.52rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 192, 203, 0.3);
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .small-btn:hover {
            background: rgba(255, 182, 193, 0.25);
            border-color: rgba(255, 192, 203, 0.6);
            box-shadow: 0 0 12px rgba(255, 182, 193, 0.4);
            transform: translateY(-1px);
        }

        /* ==========================================
           أنماط الألغاز الزجاجية (Glassmorphism Modals)
           ========================================== */
        .puzzle-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 8, 18, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }

        .puzzle-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* الحاوية الزجاجية المركزية للغز */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        /* Holographic Screen Display */
        .holo-screen {
            background: rgba(15, 12, 25, 0.7);
            border: 1px solid rgba(255, 192, 203, 0.3);
            box-shadow: inset 0 0 20px rgba(255, 105, 180, 0.15), 0 0 15px rgba(255, 105, 180, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .holo-screen.broken::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 100, 0.03), rgba(0, 255, 200, 0.02), rgba(255, 255, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .holo-screen.active {
            background: rgba(20, 15, 35, 0.85);
            border-color: rgba(255, 182, 193, 0.8);
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.4), inset 0 0 15px rgba(255, 182, 193, 0.2);
        }

        .floating-answer {
            display: inline-block;
            animation: bounceAndMove 4s ease-in-out infinite alternate;
            text-shadow: 0 0 15px rgba(255, 192, 203, 0.8), 0 0 30px rgba(255, 105, 180, 0.5);
        }

        @keyframes bounceAndMove {
            0% { transform: translate(-5%, -3%) scale(1); }
            50% { transform: translate(5%, 3%) scale(1.05); }
            100% { transform: translate(-3%, 4%) scale(1.02); }
        }

        /* المساعد الزجاجي المتوهج Glass Assistant */
        .glass-assistant-wrapper {
            filter: drop-shadow(0 10px 20px rgba(255, 105, 180, 0.25));
            transition: all 0.4s ease;
        }

        .glass-assistant-wrapper:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 15px 30px rgba(255, 105, 180, 0.4));
        }

        /* Button Custom Styling */
        .glass-btn-primary {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.3), rgba(255, 105, 180, 0.4));
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.25);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .glass-btn-primary:hover {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.5), rgba(255, 105, 180, 0.6));
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
            transform: translateY(-2px);
        }

        .glass-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .glass-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-shake-red {
            animation: shakeRed 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.6), rgba(220, 38, 38, 0.7)) !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6) !important;
            border-color: rgba(255, 255, 255, 0.6) !important;
        }

        @keyframes shakeRed {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .btn-shake-green {
            animation: shakeGreen 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.6), rgba(5, 150, 105, 0.7)) !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.8) !important;
        }

        @keyframes shakeGreen {
            0% { transform: scale(1); }
            30% { transform: scale(1.08); }
            50% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }

        /* Puzzle Elements */
        .glass-tile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-tile:hover {
            border-color: rgba(255, 192, 203, 0.6);
            transform: scale(1.03);
            box-shadow: 0 0 12px rgba(255, 182, 193, 0.3);
        }

        .selected-tile {
            border-color: #ffb6c1 !important;
            box-shadow: 0 0 18px rgba(255, 182, 193, 0.8) !important;
            transform: scale(0.97);
        }

        .letter-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            color: #ffffff;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .letter-btn:hover {
            background: rgba(255, 182, 193, 0.25);
            border-color: rgba(255, 192, 203, 0.6);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
        }

        .letter-slot {
            background: rgba(0, 0, 0, 0.25);
            border: 1.5px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .connected-image {
            animation: popConnected 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popConnected {
            0% { transform: scale(0.92); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- فيديو الخلفية -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/workmemo2007-gif/R1/0d60df8b2327c8cb790f747c425956b407036370/lv_0_%D9%A2%D9%A0%D9%A2%D9%A6%D9%A0%D9%A9%D9%A2%D9%A2%D9%A2%D9%A1%D9%A3%D9%A5%D9%A1%D9%A4.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="overlay"></div>

    <!-- المغلف الرئيسي -->
    <div class="envelope-wrapper" id="envelope">
        <div class="glass-card" id="card">
            <div class="card-cover">
                <img src="https://raw.githubusercontent.com/workmemo2007-gif/R1/092a6042ee20ce4084bd4d0f9fd6887320b0bc23/IMG_2536.jpeg" alt="غلاف الكارت" class="cover-img">
            </div>
            
            <div class="typing-container">
                <span class="typing-text" id="typewriter"></span>
            </div>

            <div class="games-container">
                <button class="small-btn" id="puzzle1Btn">اللغز الأول</button>
                <button class="small-btn" id="puzzle2Btn">اللغز الثاني</button>
                <button class="small-btn">اللغز الثالث</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         نافذة اللغز الأول: لغز الحروف (النمط الزجاجي)
         ========================================== -->
    <div id="puzzle1Modal" class="puzzle-modal p-4 text-white">
        
        <button class="closeModalBtn absolute top-5 right-5 glass-btn-secondary px-4 py-2 rounded-xl text-xs md:text-sm font-bold z-10 text-white/90 hover:text-white flex items-center gap-2">
            ✕ العودة للرئيسية
        </button>

        <div class="glass-panel w-full max-w-2xl p-5 md:p-8 flex flex-col items-center gap-6 my-auto">
            
            <div class="w-full flex flex-col md:flex-row items-center justify-center gap-5">
                
                <!-- المساعد الزجاجي -->
                <div class="flex flex-col items-center shrink-0">
                    <div id="p1_assistant" class="glass-assistant-wrapper w-20 h-20 md:w-24 md:h-24 relative">
                        <svg viewBox="0 0 200 200" class="w-full h-full">
                            <defs>
                                <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
                                    <stop offset="0%" stop-color="#ffb6c1" stop-opacity="0.8"/>
                                    <stop offset="70%" stop-color="#ff69b4" stop-opacity="0.3"/>
                                    <stop offset="100%" stop-color="#ff1493" stop-opacity="0"/>
                                </radialGradient>
                            </defs>
                            
                            <circle cx="100" cy="100" r="85" fill="url(#glassGlow)" class="animate-pulse" />
                            <circle cx="100" cy="100" r="65" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 192, 203, 0.5)" stroke-width="3" />
                            
                            <!-- Eyes -->
                            <g id="p1_eyesNeutral">
                                <circle cx="75" cy="90" r="8" fill="#ffffff" />
                                <circle cx="125" cy="90" r="8" fill="#ffffff" />
                            </g>
                            <g id="p1_eyesSad" class="hidden">
                                <path d="M 68 95 Q 75 85 82 95" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                                <path d="M 118 95 Q 125 85 132 95" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                            </g>
                            <g id="p1_eyesHappy" class="hidden">
                                <path d="M 68 88 Q 75 98 82 88" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                                <path d="M 118 88 Q 125 98 132 88" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                            </g>

                            <!-- Mouth -->
                            <path id="p1_mouthNeutral" d="M 90 120 Q 100 125 110 120" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
                            <path id="p1_mouthSad" d="M 90 125 Q 100 115 110 125" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" class="hidden" />
                            <path id="p1_mouthHappy" d="M 88 118 Q 100 132 112 118 Z" fill="#ffffff" class="hidden" />
                        </svg>
                    </div>
                </div>

                <!-- الشاشة الهولوغرامية -->
                <div class="w-full max-w-md">
                    <div id="p1_tvScreen" class="holo-screen broken rounded-2xl h-24 md:h-28 flex flex-col items-center justify-center p-3 text-center">
                        <div id="p1_screenOffContent" class="flex flex-col items-center gap-1">
                            <span class="text-xs md:text-sm font-bold tracking-widest text-pink-200/60 uppercase">إشارة القفل مفعلة</span>
                            <p class="text-pink-300/40 text-[10px] md:text-xs font-mono">=== WAITING FOR DECRYPTION ===</p>
                        </div>

                        <div id="p1_screenOnContent" class="hidden w-full h-full flex items-center justify-center">
                            <span class="floating-answer text-white font-black text-2xl md:text-3xl tracking-widest">
                                علويتي رتاج
                            </span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- نص الإرشاد -->
            <div id="p1_speech" class="bg-white/10 border border-white/20 text-pink-100 text-xs md:text-sm font-medium px-5 py-2 rounded-full backdrop-blur-md">
                رتب الحروف لإلغاء قفل الشاشة الزجاجية ✨
            </div>

            <!-- منطقة حقول اللعب -->
            <div class="w-full flex flex-col gap-6">
                <div class="flex flex-row-reverse items-center justify-center gap-3 w-full overflow-x-auto py-1">
                    <div id="word1Container" class="flex flex-row-reverse justify-center gap-1.5 p-2 bg-black/20 rounded-2xl border border-white/10 shrink-0"></div>
                    <div id="word2Container" class="flex flex-row-reverse justify-center gap-1.5 p-2 bg-black/20 rounded-2xl border border-white/10 shrink-0"></div>
                </div>

                <div class="flex flex-col items-center gap-3 border-t border-white/10 pt-4">
                    <span class="text-xs font-semibold text-white/60">الحروف المبعثرة (انقر لترتيبها):</span>
                    <div id="lettersBank" class="flex flex-wrap justify-center gap-2 min-h-[50px] p-1"></div>
                </div>

                <!-- الأزرار -->
                <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                    <button id="p1_finishBtn" class="glass-btn-primary w-full sm:w-auto px-8 py-3 text-white font-bold text-sm md:text-base rounded-xl flex items-center justify-center gap-2">
                        <span>تم الإنهاء</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </button>

                    <button id="p1_resetBtn" class="glass-btn-secondary w-full sm:w-auto px-6 py-3 text-white/80 font-bold text-sm rounded-xl flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span>إعادة المحاولة</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- ==========================================
         نافذة اللغز الثاني: لغز الصورة (النمط الزجاجي)
         ========================================== -->
    <div id="puzzle2Modal" class="puzzle-modal p-4 text-white">
        
        <button class="closeModalBtn absolute top-5 right-5 glass-btn-secondary px-4 py-2 rounded-xl text-xs md:text-sm font-bold z-10 text-white/90 hover:text-white flex items-center gap-2">
            ✕ العودة للرئيسية
        </button>

        <div class="glass-panel w-full max-w-xl p-5 md:p-7 flex flex-col items-center gap-5 my-auto">
            
            <div class="w-full flex flex-col items-center gap-3">
                
                <!-- الشاشة الهولوغرامية لصورة المفاجأة -->
                <div id="p2_tvScreen" class="holo-screen broken rounded-2xl w-full h-32 md:h-40 flex flex-col items-center justify-center p-3 text-center">
                    
                    <div id="p2_screenOffContent" class="flex flex-col items-center gap-1">
                        <span class="text-xs md:text-sm font-bold tracking-widest text-pink-200/60 uppercase">الصورة مشفرة</span>
                        <p class="text-pink-300/40 text-[10px] md:text-xs font-mono">=== REASSEMBLE TILES ===</p>
                    </div>

                    <div id="p2_screenOnContent" class="hidden w-full h-full flex flex-col items-center justify-center relative overflow-hidden rounded-xl">
                        <img id="p2_fullPreviewImage" class="w-full h-full object-cover" alt="Completed Image" />
                        <div class="absolute bottom-2 bg-black/60 backdrop-blur-md text-white text-xs px-4 py-1 rounded-full font-bold border border-white/20">
                            علويتي رتاج ✨
                        </div>
                    </div>
                </div>

            </div>

            <!-- نص الإرشاد -->
            <div id="p2_speech" class="bg-white/10 border border-white/20 text-pink-100 text-xs md:text-sm font-medium px-5 py-1.5 rounded-full backdrop-blur-md">
                رتب أجزاء الصورة لإظهار الرسالة الزجاجية ✨
            </div>

            <!-- لوحة الصورة المبعثرة -->
            <div class="flex flex-col items-center gap-5 w-full">
                
                <div id="puzzleBoardWrapper" class="relative w-60 h-60 md:w-72 md:h-72">
                    <div id="puzzleBoard" class="grid grid-cols-3 gap-2 p-2 bg-black/20 rounded-2xl border border-white/10 w-full h-full shadow-inner">
                    </div>

                    <div id="connectedBoard" class="hidden absolute inset-0 w-full h-full rounded-2xl overflow-hidden border-2 border-pink-300 shadow-2xl connected-image">
                        <img id="completedPuzzleImg" class="w-full h-full object-cover" alt="Connected Result" />
                    </div>
                </div>

                <!-- الأزرار -->
                <div class="flex items-center justify-center gap-3 w-full max-w-xs">
                    <button id="p2_finishBtn" class="glass-btn-primary flex-1 py-3 text-white font-bold text-sm md:text-base rounded-xl flex items-center justify-center gap-2">
                        <span>تم الإنهاء</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </button>

                    <button id="p2_resetBtn" class="glass-btn-secondary px-5 py-3 text-white/80 font-bold text-sm rounded-xl flex items-center justify-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span>إعادة</span>
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- ==========================================
         برمجة السكريبت المدمجة
         ========================================== -->
    <script>
        /* --- 1. المؤثرات الصوتية العامة --- */
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.setValueAtTime(130, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.09);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.09 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.09);
                    osc.stop(this.ctx.currentTime + idx * 0.09 + 0.25);
                });
            }
        }

        const soundFX = new SoundFX();

        /* --- 2. منطق الواجهة الرئيسية والمغلف --- */
        const text = "أهلاً بالعلوية رتاج، هناك هدية بانتظارك، ولكن حتى تصلين إلى الهدية يجب اجتياز ثلاث مراحل صعبة وخيرة حتى تصل الأميرة إلى قصرها...";
        let index = 0;
        const speed = 45; 
        let isOpened = false;

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    document.getElementById("envelope").classList.add("hide-envelope");
                }, 2000);
            }
        }

        const envelope = document.getElementById("envelope");

        envelope.addEventListener("click", (e) => {
            if(e.target.classList.contains('small-btn')) return;
            if (!isOpened) {
                isOpened = true;
                envelope.classList.add("open");
                setTimeout(typeWriter, 800);
            }
        });

        // إدارة فتح وإغلاق النوافذ المنبثقة
        const puzzle1Btn = document.getElementById('puzzle1Btn');
        const puzzle2Btn = document.getElementById('puzzle2Btn');
        const puzzle1Modal = document.getElementById('puzzle1Modal');
        const puzzle2Modal = document.getElementById('puzzle2Modal');
        const closeBtns = document.querySelectorAll('.closeModalBtn');

        puzzle1Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            initP1Game();
            puzzle1Modal.classList.add('active');
        });

        puzzle2Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            initP2Game();
            puzzle2Modal.classList.add('active');
        });

        closeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                puzzle1Modal.classList.remove('active');
                puzzle2Modal.classList.remove('active');
            });
        });

        /* --- 3. منطق اللغز الأول (ترتيب الحروف) --- */
        const WORD1_TARGET = ['ع', 'ل', 'و', 'ي', 'ت', 'ي'];
        const WORD2_TARGET = ['ر', 'ت', 'ا', 'ج'];
        const ALL_LETTERS = [...WORD1_TARGET, ...WORD2_TARGET];

        let currentWord1 = new Array(6).fill(null);
        let currentWord2 = new Array(4).fill(null);
        let availablePool = [];

        const p1_word1Container = document.getElementById('word1Container');
        const p1_word2Container = document.getElementById('word2Container');
        const p1_lettersBank = document.getElementById('lettersBank');
        const p1_finishBtn = document.getElementById('p1_finishBtn');
        const p1_resetBtn = document.getElementById('p1_resetBtn');
        const p1_tvScreen = document.getElementById('p1_tvScreen');
        const p1_screenOffContent = document.getElementById('p1_screenOffContent');
        const p1_screenOnContent = document.getElementById('p1_screenOnContent');
        
        const p1_eyesNeutral = document.getElementById('p1_eyesNeutral');
        const p1_eyesSad = document.getElementById('p1_eyesSad');
        const p1_eyesHappy = document.getElementById('p1_eyesHappy');
        const p1_mouthNeutral = document.getElementById('p1_mouthNeutral');
        const p1_mouthSad = document.getElementById('p1_mouthSad');
        const p1_mouthHappy = document.getElementById('p1_mouthHappy');
        const p1_speech = document.getElementById('p1_speech');

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initP1Game() {
            currentWord1 = new Array(6).fill(null);
            currentWord2 = new Array(4).fill(null);
            
            availablePool = shuffleArray(ALL_LETTERS).map((char, index) => ({
                id: `char-${index}-${Date.now()}`,
                char: char
            }));

            setP1AssistantState('neutral');
            resetP1Screen();
            resetP1ButtonStyles();
            renderP1Board();
        }

        function renderP1Board() {
            p1_word1Container.innerHTML = '';
            currentWord1.forEach((item, index) => {
                const slot = createSlotElement(item, () => removeLetterFromWord(1, index));
                p1_word1Container.appendChild(slot);
            });

            p1_word2Container.innerHTML = '';
            currentWord2.forEach((item, index) => {
                const slot = createSlotElement(item, () => removeLetterFromWord(2, index));
                p1_word2Container.appendChild(slot);
            });

            p1_lettersBank.innerHTML = '';
            availablePool.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn font-extrabold text-lg md:text-xl w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center cursor-pointer shadow-sm';
                btn.innerText = item.char;
                btn.onclick = () => {
                    soundFX.playTap();
                    addLetterToNextAvailable(item);
                };
                p1_lettersBank.appendChild(btn);
            });
        }

        function createSlotElement(item, onClick) {
            const slot = document.createElement('div');
            slot.className = 'letter-slot w-10 h-10 md:w-11 md:h-11 flex items-center justify-center';
            
            if (item) {
                const letterBtn = document.createElement('button');
                letterBtn.className = 'letter-btn bg-pink-500/30 border-pink-300/50 text-white font-extrabold text-lg md:text-xl w-full h-full rounded-xl shadow-sm flex items-center justify-center cursor-pointer';
                letterBtn.innerText = item.char;
                letterBtn.onclick = () => {
                    soundFX.playTap();
                    onClick();
                };
                slot.appendChild(letterBtn);
            }
            return slot;
        }

        function addLetterToNextAvailable(item) {
            const emptyW1Index = currentWord1.findIndex(slot => slot === null);
            if (emptyW1Index !== -1) {
                currentWord1[emptyW1Index] = item;
                availablePool = availablePool.filter(p => p.id !== item.id);
                renderP1Board();
                return;
            }

            const emptyW2Index = currentWord2.findIndex(slot => slot === null);
            if (emptyW2Index !== -1) {
                currentWord2[emptyW2Index] = item;
                availablePool = availablePool.filter(p => p.id !== item.id);
                renderP1Board();
                return;
            }
        }

        function removeLetterFromWord(wordNumber, index) {
            let item = null;
            if (wordNumber === 1) {
                item = currentWord1[index];
                currentWord1[index] = null;
            } else {
                item = currentWord2[index];
                currentWord2[index] = null;
            }

            if (item) {
                availablePool.push(item);
                renderP1Board();
            }
        }

        function setP1AssistantState(state) {
            p1_eyesNeutral.classList.add('hidden');
            p1_eyesSad.classList.add('hidden');
            p1_eyesHappy.classList.add('hidden');
            p1_mouthNeutral.classList.add('hidden');
            p1_mouthSad.classList.add('hidden');
            p1_mouthHappy.classList.add('hidden');

            if (state === 'sad') {
                p1_eyesSad.classList.remove('hidden');
                p1_mouthSad.classList.remove('hidden');
                p1_speech.innerText = "الترتيب غير صحيح 🥀 حاولي مرة أخرى!";
                p1_speech.className = "bg-rose-500/20 border border-rose-300/40 text-rose-100 text-xs md:text-sm font-medium px-5 py-2 rounded-full backdrop-blur-md animate-bounce";
            } else if (state === 'happy') {
                p1_eyesHappy.classList.remove('hidden');
                p1_mouthHappy.classList.remove('hidden');
                p1_speech.innerText = "رائع جداً! تم فك القفل بنجاح ✨";
                p1_speech.className = "bg-emerald-500/20 border border-emerald-300/40 text-emerald-100 text-xs md:text-sm font-medium px-5 py-2 rounded-full backdrop-blur-md";
            } else {
                p1_eyesNeutral.classList.remove('hidden');
                p1_mouthNeutral.classList.remove('hidden');
                p1_speech.innerText = "رتب الحروف لإلغاء قفل الشاشة الزجاجية ✨";
                p1_speech.className = "bg-white/10 border border-white/20 text-pink-100 text-xs md:text-sm font-medium px-5 py-2 rounded-full backdrop-blur-md";
            }
        }

        function activateP1Screen() {
            p1_tvScreen.classList.remove('broken');
            p1_tvScreen.classList.add('active');
            p1_screenOffContent.classList.add('hidden');
            p1_screenOnContent.classList.remove('hidden');
        }

        function resetP1Screen() {
            p1_tvScreen.classList.remove('active');
            p1_tvScreen.classList.add('broken');
            p1_screenOffContent.classList.remove('hidden');
            p1_screenOnContent.classList.add('hidden');
        }

        function resetP1ButtonStyles() {
            p1_finishBtn.className = "glass-btn-primary w-full sm:w-auto px-8 py-3 text-white font-bold text-sm md:text-base rounded-xl flex items-center justify-center gap-2";
        }

        p1_finishBtn.addEventListener('click', () => {
            resetP1ButtonStyles();

            const userWord1 = currentWord1.map(i => i ? i.char : '').join('');
            const userWord2 = currentWord2.map(i => i ? i.char : '').join('');

            const target1 = WORD1_TARGET.join('');
            const target2 = WORD2_TARGET.join('');

            const isCorrect = (userWord1 === target1) && (userWord2 === target2);

            if (isCorrect) {
                soundFX.playSuccess();
                setP1AssistantState('happy');
                activateP1Screen();
                p1_finishBtn.classList.add('btn-shake-green');

                if (window.confetti) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }

                // العودة للرئيسية تلقائياً بعد 3 ثوانٍ
                setTimeout(() => {
                    puzzle1Modal.classList.remove('active');
                }, 3000);

            } else {
                soundFX.playError();
                setP1AssistantState('sad');
                resetP1Screen();
                p1_finishBtn.classList.add('btn-shake-red');

                setTimeout(() => {
                    p1_finishBtn.classList.remove('btn-shake-red');
                }, 700);
            }
        });

        p1_resetBtn.addEventListener('click', () => {
            soundFX.playTap();
            initP1Game();
        });

        /* --- 4. منطق اللغز الثاني (الصورة المبعثرة) --- */
        const PUZZLE_IMAGE_URL = 'https://raw.githubusercontent.com/workmemo2007-gif/R1/8cdc86bc9d87047114af81f2a2f85f77cb6e33b4/IMG_2540.jpeg';
        const GRID_SIZE = 3;
        const TOTAL_TILES = GRID_SIZE * GRID_SIZE;
        const TARGET_BOARD = [2, 1, 0, 5, 4, 3, 8, 7, 6];

        let currentP2Board = [];
        let selectedTileIndex = null;

        const puzzleBoard = document.getElementById('puzzleBoard');
        const connectedBoard = document.getElementById('connectedBoard');
        const completedPuzzleImg = document.getElementById('completedPuzzleImg');
        const p2_finishBtn = document.getElementById('p2_finishBtn');
        const p2_resetBtn = document.getElementById('p2_resetBtn');
        const p2_tvScreen = document.getElementById('p2_tvScreen');
        const p2_screenOffContent = document.getElementById('p2_screenOffContent');
        const p2_screenOnContent = document.getElementById('p2_screenOnContent');
        const p2_fullPreviewImage = document.getElementById('p2_fullPreviewImage');
        const p2_speech = document.getElementById('p2_speech');

        p2_fullPreviewImage.src = PUZZLE_IMAGE_URL;
        completedPuzzleImg.src = PUZZLE_IMAGE_URL;

        function initP2Game() {
            selectedTileIndex = null;
            let solved = true;
            while (solved) {
                const indexes = Array.from({ length: TOTAL_TILES }, (_, i) => i);
                currentP2Board = shuffleArray(indexes);
                solved = currentP2Board.every((val, idx) => val === TARGET_BOARD[idx]);
            }

            puzzleBoard.classList.remove('hidden');
            connectedBoard.classList.add('hidden');

            setP2SpeechState('neutral');
            resetP2Screen();
            resetP2ButtonStyles();
            renderP2Board();
        }

        function renderP2Board() {
            puzzleBoard.innerHTML = '';

            currentP2Board.forEach((originalIndex, boardPosition) => {
                const tile = document.createElement('div');
                tile.className = 'glass-tile w-full h-full rounded-xl cursor-pointer relative overflow-hidden select-none';

                const row = Math.floor(originalIndex / GRID_SIZE);
                const col = originalIndex % GRID_SIZE;
                
                const posX = col * 50;
                const posY = row * 50;

                tile.style.backgroundImage = `url('${PUZZLE_IMAGE_URL}')`;
                tile.style.backgroundSize = '300% 300%';
                tile.style.backgroundPosition = `${posX}% ${posY}%`;

                if (selectedTileIndex === boardPosition) {
                    tile.classList.add('selected-tile');
                }

                tile.onclick = () => handleP2TileClick(boardPosition);
                puzzleBoard.appendChild(tile);
            });
        }

        function handleP2TileClick(position) {
            soundFX.playTap();

            if (selectedTileIndex === null) {
                selectedTileIndex = position;
            } else if (selectedTileIndex === position) {
                selectedTileIndex = null;
            } else {
                const temp = currentP2Board[selectedTileIndex];
                currentP2Board[selectedTileIndex] = currentP2Board[position];
                currentP2Board[position] = temp;
                selectedTileIndex = null;
            }

            renderP2Board();
        }

        function setP2SpeechState(state) {
            if (state === 'sad') {
                p2_speech.innerText = "ترتيب القطع غير صحيح 🥀 حاولي مجدداً!";
                p2_speech.className = "bg-rose-500/20 border border-rose-300/40 text-rose-100 text-xs md:text-sm font-medium px-5 py-1.5 rounded-full backdrop-blur-md animate-bounce";
            } else if (state === 'happy') {
                p2_speech.innerText = "مذهل! اكتملت الصورة واشتغلت الشاشة ✨";
                p2_speech.className = "bg-emerald-500/20 border border-emerald-300/40 text-emerald-100 text-xs md:text-sm font-medium px-5 py-1.5 rounded-full backdrop-blur-md";
            } else {
                p2_speech.innerText = "رتب أجزاء الصورة لإظهار الرسالة الزجاجية ✨";
                p2_speech.className = "bg-white/10 border border-white/20 text-pink-100 text-xs md:text-sm font-medium px-5 py-1.5 rounded-full backdrop-blur-md";
            }
        }

        function activateP2Screen() {
            p2_tvScreen.classList.remove('broken');
            p2_tvScreen.classList.add('active');
            p2_screenOffContent.classList.add('hidden');
            p2_screenOnContent.classList.remove('hidden');
        }

        function resetP2Screen() {
            p2_tvScreen.classList.remove('active');
            p2_tvScreen.classList.add('broken');
            p2_screenOffContent.classList.remove('hidden');
            p2_screenOnContent.classList.add('hidden');
        }

        function resetP2ButtonStyles() {
            p2_finishBtn.className = "glass-btn-primary flex-1 py-3 text-white font-bold text-sm md:text-base rounded-xl flex items-center justify-center gap-2";
        }

        p2_finishBtn.addEventListener('click', () => {
            resetP2ButtonStyles();

            const isCorrect = currentP2Board.every((val, index) => val === TARGET_BOARD[index]);

            if (isCorrect) {
                soundFX.playSuccess();
                setP2SpeechState('happy');
                activateP2Screen();
                p2_finishBtn.classList.add('btn-shake-green');

                puzzleBoard.classList.add('hidden');
                connectedBoard.classList.remove('hidden');

                if (window.confetti) {
                    confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
                }

                // العودة التلقائية للشاشة الرئيسية بعد 3 ثوانٍ
                setTimeout(() => {
                    puzzle2Modal.classList.remove('active');
                }, 3000);

            } else {
                soundFX.playError();
                setP2SpeechState('sad');
                resetP2Screen();
                p2_finishBtn.classList.add('btn-shake-red');

                setTimeout(() => {
                    p2_finishBtn.classList.remove('btn-shake-red');
                }, 700);
            }
        });

        p2_resetBtn.addEventListener('click', () => {
            soundFX.playTap();
            initP2Game();
        });
    </script>
</body>
</html>
