<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية والألغاز - علويتي رتاج</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffffff 0%, #faf9f6 50%, #f5f2eb 100%);
            user-select: none;
            position: relative;
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
            pointer-events: none;
        }

        /* حاوية النباتات في الجانب الأيمن */
        .nature-right-panel {
            position: absolute;
            right: 0;
            bottom: 0;
            top: 0;
            width: 380px;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        /* تبطيء حركة النمو (4 ثوانٍ بدلاً من ثانتين) */
        @keyframes grassGrow {
            0% {
                transform: scaleY(0);
                opacity: 0;
            }
            100% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        /* تبطيء حركة النسيم لتصبح انسيابية وهادئة */
        @keyframes gentleSway {
            0% { transform: rotate(0deg) skewX(0deg); }
            50% { transform: rotate(1.8deg) skewX(1deg); }
            100% { transform: rotate(0deg) skewX(0deg); }
        }

        @keyframes flowerFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(4deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* توهج الأزهار السماوية */
        @keyframes cyanGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(77, 208, 225, 0.6)) drop-shadow(0 0 8px rgba(0, 229, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 10px rgba(77, 208, 225, 0.9)) drop-shadow(0 0 18px rgba(0, 229, 255, 0.7)); }
        }

        .swaying-plant {
            transform-origin: bottom right;
            animation: grassGrow 4s cubic-bezier(0.25, 1, 0.5, 1) forwards, gentleSway 8s ease-in-out 4s infinite;
        }

        .grass-blade {
            transform-origin: bottom;
            animation: grassGrow 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .floating-flower {
            transform-origin: center;
            animation: flowerFloat 6s ease-in-out infinite, cyanGlow 3s ease-in-out infinite alternate;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            z-index: 2;
            pointer-events: none;
        }

        .envelope-wrapper {
            position: relative;
            z-index: 3;
            width: 220px;
            height: 130px;
            background-color: rgba(255, 182, 193, 0.25);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 192, 203, 0.45);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.15);
            margin-top: 100px;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.8s ease, background 0.8s ease, border-color 0.8s ease;
        }

        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-top: 70px solid rgba(255, 182, 193, 0.45);
            transform-origin: top;
            transition: transform 0.6s ease 0.2s, z-index 0.2s ease 0.4s, opacity 0.8s ease;
            z-index: 5;
        }

        .envelope-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid rgba(255, 182, 193, 0.3);
            border-right: 110px solid rgba(255, 182, 193, 0.3);
            border-bottom: 65px solid rgba(255, 182, 193, 0.4);
            border-radius: 0 0 12px 12px;
            z-index: 4;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .glass-card {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            padding: 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px) saturate(160%);
            -webkit-backdrop-filter: blur(10px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            color: #333333;
            z-index: 3;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.6s ease,
                        background 0.3s ease;
        }

        .envelope-wrapper.open::before {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .envelope-wrapper.open .glass-card {
            opacity: 1;
            transform: translateX(-50%) translateY(-20px);
            z-index: 6;
        }

        .envelope-wrapper.hide-envelope {
            background-color: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .envelope-wrapper.hide-envelope::before,
        .envelope-wrapper.hide-envelope::after {
            opacity: 0;
        }

        .envelope-wrapper.hide-envelope .glass-card {
            transform: translateX(-50%) translateY(10px) scale(1.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.85);
        }

        .card-cover {
            width: 100%;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 6px;
            background: rgba(230, 230, 230, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .typing-container {
            padding: 0 2px;
            min-height: 38px;
        }

        .typing-text {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.52rem;
            font-weight: 600;
            line-height: 1.35;
            color: #333333;
            margin-bottom: 2px;
            text-align: right;
            border-left: 1.5px solid #d81b60;
            white-space: pre-wrap;
            display: inline;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #d81b60; }
        }

        .games-container {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 8px;
        }

        .small-btn {
            flex: 1;
            padding: 5px 0;
            font-size: 0.52rem;
            font-weight: 700;
            color: #d81b60;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 192, 203, 0.6);
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .small-btn:hover {
            background: rgba(255, 182, 193, 0.4);
            border-color: rgba(255, 105, 180, 0.8);
            box-shadow: 0 0 12px rgba(255, 182, 193, 0.4);
            transform: translateY(-1px);
        }

        .puzzle-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .puzzle-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .glass-panel-white {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-top: 1.5px solid rgba(255, 255, 255, 0.9);
            border-left: 1.5px solid rgba(255, 255, 255, 0.7);
            border-right: 1.5px solid rgba(255, 255, 255, 0.7);
            border-bottom: none;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.08), 0 -5px 15px rgba(255, 105, 180, 0.15);
            border-radius: 28px 28px 0 0;
            width: 100vw;
            height: 55vh;
            padding: 1.25rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            scrollbar-width: none;
        }

        .glass-panel-white::-webkit-scrollbar {
            display: none;
        }

        .puzzle-modal.active .glass-panel-white {
            transform: translateY(0);
        }

        .holo-screen-white {
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid rgba(255, 182, 193, 0.6);
            box-shadow: inset 0 0 10px rgba(255, 105, 180, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .holo-screen-white.active {
            background: rgba(255, 240, 245, 0.95);
            border-color: #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.25);
        }

        .pixel-robot-box {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.8);
            border: 1.5px solid rgba(255, 182, 193, 0.8);
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pixel-art {
            image-rendering: pixelated;
        }

        .floating-answer {
            display: inline-block;
            animation: bounceAndMove 4s ease-in-out infinite alternate;
            color: #d81b60;
            text-shadow: 0 0 8px rgba(255, 182, 193, 0.8);
        }

        @keyframes bounceAndMove {
            0% { transform: translate(-3%, -2%) scale(1); }
            100% { transform: translate(3%, 2%) scale(1.03); }
        }

        .glass-btn-primary {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.3s ease;
        }

        .glass-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
        }

        .glass-btn-secondary {
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(255, 182, 193, 0.6);
            color: #d81b60;
            transition: all 0.3s ease;
        }

        .glass-btn-secondary:hover {
            background: rgba(255, 255, 255, 1);
            border-color: #ff69b4;
        }

        .btn-shake-red {
            animation: shakeRed 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4) !important;
            color: #ffffff !important;
        }

        @keyframes shakeRed {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .btn-shake-green {
            animation: shakeGreen 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4) !important;
            color: #ffffff !important;
        }

        @keyframes shakeGreen {
            0% { transform: scale(1); }
            30% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .letter-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(255, 182, 193, 0.8);
            color: #c2185b;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .letter-btn:hover {
            background: #ffb6c1;
            color: #ffffff;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
        }

        .letter-slot-mini {
            width: 28px;
            height: 32px;
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px dashed rgba(255, 105, 180, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .glass-tile {
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease;
        }

        .glass-tile:hover {
            border-color: #ff69b4;
            transform: scale(1.03);
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }

        .selected-tile {
            border-color: #ff1493 !important;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.8) !important;
            transform: scale(0.96);
        }
    </style>
</head>

    <script>
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.setValueAtTime(130, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.09);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.09 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.09);
                    osc.stop(this.ctx.currentTime + idx * 0.09 + 0.25);
                });
            }
        }

        const soundFX = new SoundFX();

        const text = "أهلاً بالعلوية رتاج، هناك هدية بانتظارك، ولكن حتى تصلين إلى الهدية يجب اجتياز ثلاث مراحل صعبة وخيرة حتى تصل الأميرة إلى قصرها...";
        let index = 0;
        const speed = 45; 
        let isOpened = false;

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    document.getElementById("envelope").classList.add("hide-envelope");
                }, 2000);
            }
        }

        const envelope = document.getElementById("envelope");

        envelope.addEventListener("click", (e) => {
            if(e.target.classList.contains('small-btn')) return;
            if (!isOpened) {
                isOpened = true;
                envelope.classList.add("open");
                setTimeout(typeWriter, 800);
            }
        });

        const puzzle1Btn = document.getElementById('puzzle1Btn');
        const puzzle2Btn = document.getElementById('puzzle2Btn');
        const puzzle1Modal = document.getElementById('puzzle1Modal');
        const puzzle2Modal = document.getElementById('puzzle2Modal');
        const closeBtns = document.querySelectorAll('.closeModalBtn');

        puzzle1Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            initP1Game();
            puzzle1Modal.classList.add('active');
        });

        puzzle2Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            initP2Game();
            puzzle2Modal.classList.add('active');
        });

        closeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                puzzle1Modal.classList.remove('active');
                puzzle2Modal.classList.remove('active');
            });
        });

        const WORD1_TARGET = ['ع', 'ل', 'و', 'ي', 'ت', 'ي'];
        const WORD2_TARGET = ['ر', 'ت', 'ا', 'ج'];
        const ALL_LETTERS = [...WORD1_TARGET, ...WORD2_TARGET];

        let currentWord1 = new Array(6).fill(null);
        let currentWord2 = new Array(4).fill(null);
        let availablePool = [];

        const p1_word1Container = document.getElementById('word1Container');
        const p1_word2Container = document.getElementById('word2Container');
        const p1_lettersBank = document.getElementById('lettersBank');
        const p1_finishBtn = document.getElementById('p1_finishBtn');
        const p1_resetBtn = document.getElementById('p1_resetBtn');
        const p1_tvScreen = document.getElementById('p1_tvScreen');
        const p1_screenOffContent = document.getElementById('p1_screenOffContent');
        const p1_screenOnContent = document.getElementById('p1_screenOnContent');
        const p1_speech = document.getElementById('p1_speech');

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initP1Game() {
            currentWord1 = new Array(6).fill(null);
            currentWord2 = new Array(4).fill(null);
            
            availablePool = shuffleArray(ALL_LETTERS).map((char, index) => ({
                id: `char-${index}-${Date.now()}`,
                char: char
            }));

            setP1RobotState('neutral');
            resetP1Screen();
            resetP1ButtonStyles();
            renderP1Board();
        }

        function renderP1Board() {
            p1_word1Container.innerHTML = '';
            currentWord1.forEach((item, index) => {
                const slot = createSlotElement(item, () => removeLetterFromWord(1, index));
                p1_word1Container.appendChild(slot);
            });

            p1_word2Container.innerHTML = '';
            currentWord2.forEach((item, index) => {
                const slot = createSlotElement(item, () => removeLetterFromWord(2, index));
                p1_word2Container.appendChild(slot);
            });

            p1_lettersBank.innerHTML = '';
            availablePool.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn font-extrabold text-xs w-7 h-7 rounded-lg flex items-center justify-center cursor-pointer shadow-sm';
                btn.innerText = item.char;
                btn.onclick = () => {
                    soundFX.playTap();
                    addLetterToNextAvailable(item);
                };
                p1_lettersBank.appendChild(btn);
            });
        }

        function createSlotElement(item, onClick) {
            const slot = document.createElement('div');
            slot.className = 'letter-slot-mini';
            
            if (item) {
                const letterBtn = document.createElement('button');
                letterBtn.className = 'letter-btn bg-pink-400 text-white font-extrabold text-xs w-full h-full rounded-md shadow-sm flex items-center justify-center cursor-pointer';
                letterBtn.innerText = item.char;
                letterBtn.onclick = () => {
                    soundFX.playTap();
                    onClick();
                };
                slot.appendChild(letterBtn);
            }
            return slot;
        }

        function addLetterToNextAvailable(item) {
            const emptyW1Index = currentWord1.findIndex(slot => slot === null);
            if (emptyW1Index !== -1) {
                currentWord1[emptyW1Index] = item;
                availablePool = availablePool.filter(p => p.id !== item.id);
                renderP1Board();
                return;
            }

            const emptyW2Index = currentWord2.findIndex(slot => slot === null);
            if (emptyW2Index !== -1) {
                currentWord2[emptyW2Index] = item;
                availablePool = availablePool.filter(p => p.id !== item.id);
                renderP1Board();
                return;
            }
        }

        function removeLetterFromWord(wordNumber, index) {
            let item = null;
            if (wordNumber === 1) {
                item = currentWord1[index];
                currentWord1[index] = null;
            } else {
                item = currentWord2[index];
                currentWord2[index] = null;
            }

            if (item) {
                availablePool.push(item);
                renderP1Board();
            }
        }

        function setP1RobotState(state) {
            const pxMouth = document.getElementById('p1_pxMouth');
            if (state === 'sad') {
                pxMouth.setAttribute('fill', '#ef4444');
                p1_speech.innerText = "الترتيب غير صحيح 🥀 حاولي مرة أخرى!";
                p1_speech.className = "bg-rose-100/80 border border-rose-300 text-rose-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm animate-bounce text-center my-1 w-11/12";
            } else if (state === 'happy') {
                pxMouth.setAttribute('fill', '#10b981');
                p1_speech.innerText = "رائع جداً! تم فك القفل بنجاح ✨";
                p1_speech.className = "bg-emerald-100/80 border border-emerald-300 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm text-center my-1 w-11/12";
            } else {
                pxMouth.setAttribute('fill', '#c2185b');
                p1_speech.innerText = "رتب الحروف لإلغاء قفل الشاشة ✨";
                p1_speech.className = "bg-white/80 border border-pink-200 text-pink-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm text-center my-1 w-11/12";
            }
        }

        function activateP1Screen() {
            p1_tvScreen.classList.add('active');
            p1_screenOffContent.classList.add('hidden');
            p1_screenOnContent.classList.remove('hidden');
        }

        function resetP1Screen() {
            p1_tvScreen.classList.remove('active');
            p1_screenOffContent.classList.remove('hidden');
            p1_screenOnContent.classList.add('hidden');
        }

        function resetP1ButtonStyles() {
            p1_finishBtn.className = "glass-btn-primary flex-1 py-2.5 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-1.5";
        }

        p1_finishBtn.addEventListener('click', () => {
            resetP1ButtonStyles();

            const userWord1 = currentWord1.map(i => i ? i.char : '').join('');
            const userWord2 = currentWord2.map(i => i ? i.char : '').join('');

            const target1 = WORD1_TARGET.join('');
            const target2 = WORD2_TARGET.join('');

            const isCorrect = (userWord1 === target1) && (userWord2 === target2);

            if (isCorrect) {
                soundFX.playSuccess();
                setP1RobotState('happy');
                activateP1Screen();
                p1_finishBtn.classList.add('btn-shake-green');

                if (window.confetti) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });
                }

                setTimeout(() => {
                    puzzle1Modal.classList.remove('active');
                }, 3000);

            } else {
                soundFX.playError();
                setP1RobotState('sad');
                resetP1Screen();
                p1_finishBtn.classList.add('btn-shake-red');

                setTimeout(() => {
                    p1_finishBtn.classList.remove('btn-shake-red');
                }, 700);
            }
        });

        p1_resetBtn.addEventListener('click', () => {
            soundFX.playTap();
            initP1Game();
        });

        const PUZZLE_IMAGE_URL = 'https://raw.githubusercontent.com/workmemo2007-gif/R1/8cdc86bc9d87047114af81f2a2f85f77cb6e33b4/IMG_2540.jpeg';
        const GRID_SIZE = 3;
        const TOTAL_TILES = GRID_SIZE * GRID_SIZE;
        const TARGET_BOARD = [2, 1, 0, 5, 4, 3, 8, 7, 6];

        let currentP2Board = [];
        let selectedTileIndex = null;

        const puzzleBoard = document.getElementById('puzzleBoard');
        const connectedBoard = document.getElementById('connectedBoard');
        const completedPuzzleImg = document.getElementById('completedPuzzleImg');
        const p2_finishBtn = document.getElementById('p2_finishBtn');
        const p2_resetBtn = document.getElementById('p2_resetBtn');
        const p2_tvScreen = document.getElementById('p2_tvScreen');
        const p2_screenOffContent = document.getElementById('p2_screenOffContent');
        const p2_screenOnContent = document.getElementById('p2_screenOnContent');
        const p2_fullPreviewImage = document.getElementById('p2_fullPreviewImage');
        const p2_speech = document.getElementById('p2_speech');

        p2_fullPreviewImage.src = PUZZLE_IMAGE_URL;
        completedPuzzleImg.src = PUZZLE_IMAGE_URL;

        function initP2Game() {
            selectedTileIndex = null;
            let solved = true;
            while (solved) {
                const indexes = Array.from({ length: TOTAL_TILES }, (_, i) => i);
                currentP2Board = shuffleArray(indexes);
                solved = currentP2Board.every((val, idx) => val === TARGET_BOARD[idx]);
            }

            puzzleBoard.classList.remove('hidden');
            connectedBoard.classList.add('hidden');

            setP2SpeechState('neutral');
            resetP2Screen();
            resetP2ButtonStyles();
            renderP2Board();
        }

        function renderP2Board() {
            puzzleBoard.innerHTML = '';

            currentP2Board.forEach((originalIndex, boardPosition) => {
                const tile = document.createElement('div');
                tile.className = 'glass-tile w-full h-full rounded-xl cursor-pointer relative overflow-hidden select-none';

                const row = Math.floor(originalIndex / GRID_SIZE);
                const col = originalIndex % GRID_SIZE;
                
                const posX = col * 50;
                const posY = row * 50;

                tile.style.backgroundImage = `url('${PUZZLE_IMAGE_URL}')`;
                tile.style.backgroundSize = '300% 300%';
                tile.style.backgroundPosition = `${posX}% ${posY}%`;

                if (selectedTileIndex === boardPosition) {
                    tile.classList.add('selected-tile');
                }

                tile.onclick = () => handleP2TileClick(boardPosition);
                puzzleBoard.appendChild(tile);
            });
        }

        function handleP2TileClick(position) {
            soundFX.playTap();

            if (selectedTileIndex === null) {
                selectedTileIndex = position;
            } else if (selectedTileIndex === position) {
                selectedTileIndex = null;
            } else {
                const temp = currentP2Board[selectedTileIndex];
                currentP2Board[selectedTileIndex] = currentP2Board[position];
                currentP2Board[position] = temp;
                selectedTileIndex = null;
            }

            renderP2Board();
        }

        function setP2SpeechState(state) {
            const pxMouth = document.getElementById('p2_pxMouth');
            if (state === 'sad') {
                pxMouth.setAttribute('fill', '#ef4444');
                p2_speech.innerText = "ترتيب القطع غير صحيح 🥀 حاولي مجدداً!";
                p2_speech.className = "bg-rose-100/80 border border-rose-300 text-rose-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm animate-bounce text-center my-1 w-11/12";
            } else if (state === 'happy') {
                pxMouth.setAttribute('fill', '#10b981');
                p2_speech.innerText = "مذهل! اكتملت الصورة وااشتغلت الشاشة ✨";
                p2_speech.className = "bg-emerald-100/80 border border-emerald-300 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm text-center my-1 w-11/12";
            } else {
                pxMouth.setAttribute('fill', '#c2185b');
                p2_speech.innerText = "رتب أجزاء الصورة لإظهار الرسالة ✨";
                p2_speech.className = "bg-white/80 border border-pink-200 text-pink-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm text-center my-1 w-11/12";
            }
        }

        function activateP2Screen() {
            p2_tvScreen.classList.add('active');
            p2_screenOffContent.classList.add('hidden');
            p2_screenOnContent.classList.remove('hidden');
        }

        function resetP2Screen() {
            p2_tvScreen.classList.remove('active');
            p2_screenOffContent.classList.remove('hidden');
            p2_screenOnContent.classList.add('hidden');
        }

        function resetP2ButtonStyles() {
            p2_finishBtn.className = "glass-btn-primary flex-1 py-2.5 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-1.5";
        }

        p2_finishBtn.addEventListener('click', () => {
            resetP2ButtonStyles();

            const isCorrect = currentP2Board.every((val, index) => val === TARGET_BOARD[index]);

            if (isCorrect) {
                soundFX.playSuccess();
                setP2SpeechState('happy');
                activateP2Screen();
                p2_finishBtn.classList.add('btn-shake-green');

                puzzleBoard.classList.add('hidden');
                connectedBoard.classList.remove('hidden');

                if (window.confetti) {
                    confetti({ particleCount: 130, spread: 85, origin: { y: 0.5 } });
                }

                setTimeout(() => {
                    puzzle2Modal.classList.remove('active');
                }, 3000);

            } else {
                soundFX.playError();
                setP2SpeechState('sad');
                resetP2Screen();
                p2_finishBtn.classList.add('btn-shake-red');

                setTimeout(() => {
                    p2_finishBtn.classList.remove('btn-shake-red');
                }, 700);
            }
        });

        p2_resetBtn.addEventListener('click', () => {
            soundFX.playTap();
            initP2Game();
        });
    </script>
</body>
</html>
