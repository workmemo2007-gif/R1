<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية ولغز الحروف</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            user-select: none;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        /* حاوية المغلف الوردي الشفاف */
        .envelope-wrapper {
            position: relative;
            z-index: 3;
            width: 220px;
            height: 130px;
            background-color: rgba(255, 182, 193, 0.25);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.4);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            margin-top: 100px;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.8s ease, background 0.8s ease, border-color 0.8s ease;
        }

        /* غطاء المغلف العلوي الوردي */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-top: 70px solid rgba(255, 182, 193, 0.45);
            transform-origin: top;
            transition: transform 0.6s ease 0.2s, z-index 0.2s ease 0.4s, opacity 0.8s ease;
            z-index: 5;
        }

        /* جيب المغلف السفلي الوردي */
        .envelope-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid rgba(255, 182, 193, 0.3);
            border-right: 110px solid rgba(255, 182, 193, 0.3);
            border-bottom: 65px solid rgba(255, 182, 193, 0.4);
            border-radius: 0 0 8px 8px;
            z-index: 4;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        /* تصميم كارت الزجاج المصغر */
        .glass-card {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px) saturate(150%);
            -webkit-backdrop-filter: blur(6px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            color: #ffffff;
            z-index: 3;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.6s ease,
                        background 0.3s ease;
        }

        /* انيميشن فتح المغلف */
        .envelope-wrapper.open::before {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .envelope-wrapper.open .glass-card {
            opacity: 1;
            transform: translateX(-50%) translateY(-20px);
            z-index: 6;
        }

        /* مرحلة انبثاق الكارت للأمام واختفاء الظرف */
        .envelope-wrapper.hide-envelope {
            background-color: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .envelope-wrapper.hide-envelope::before,
        .envelope-wrapper.hide-envelope::after {
            opacity: 0;
        }

        .envelope-wrapper.hide-envelope .glass-card {
            transform: translateX(-50%) translateY(10px) scale(1.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.05);
        }

        /* غلاف الكارت */
        .card-cover {
            width: 100%;
            height: 75px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* حاوية النص والخط الرئيسي */
        .typing-container {
            padding: 0 2px;
            min-height: 38px;
        }

        .typing-text {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.52rem;
            font-weight: 500;
            line-height: 1.35;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 2px;
            text-align: right;
            border-left: 1.5px solid #ffffff;
            white-space: pre-wrap;
            display: inline;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffffff; }
        }

        /* أزرار الألغاز */
        .games-container {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 8px;
        }

        .small-btn {
            flex: 1;
            padding: 4px 0;
            font-size: 0.5rem;
            font-weight: 500;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
        }

        .small-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* ==========================================
           أنماط اللغز الأول (Puzzle Modal Layer)
           ========================================== */
        #puzzleModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(224, 242, 254, 0.95) 0%, rgba(186, 230, 253, 0.95) 50%, rgba(240, 249, 255, 0.95) 100%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }

        #puzzleModal.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* TV Screen Styles */
        .tv-screen {
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            border: 6px solid #334155;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 8px 20px -5px rgba(0, 0, 0, 0.3);
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tv-screen.broken::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .tv-screen.broken .glitch-text {
            animation: glitch 1.5s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: -2px 0 #ff0055, 2px 0 #00e5ff; }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); text-shadow: 2px 0 #ff0055, -2px 0 #00e5ff; }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); text-shadow: -2px 0 #ff0055, 2px 0 #00e5ff; }
        }

        .tv-screen.active {
            background: linear-gradient(45deg, #0284c7, #38bdf8);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.5);
        }

        .floating-answer {
            display: inline-block;
            animation: bounceAndMove 4s ease-in-out infinite alternate;
            text-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        @keyframes bounceAndMove {
            0% { transform: translate(-10%, -5%) scale(1) rotate(-2deg); }
            50% { transform: translate(10%, 5%) scale(1.08) rotate(2deg); }
            100% { transform: translate(-5%, 8%) scale(1.03) rotate(-1deg); }
        }

        .bear-container {
            transition: transform 0.3s ease;
        }

        .bear-sad {
            animation: headShake 0.8s ease-in-out, droop 0.5s forwards;
        }

        .bear-happy {
            animation: happyJump 0.6s ease-in-out infinite alternate;
        }

        @keyframes headShake {
            0%, 100% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-10px) rotate(-5deg); }
            40% { transform: translateX(10px) rotate(5deg); }
            60% { transform: translateX(-8px) rotate(-3deg); }
            80% { transform: translateX(8px) rotate(3deg); }
        }

        @keyframes happyJump {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-12px) scale(1.05); }
        }

        .btn-shake-red {
            animation: shakeRed 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.7) !important;
            color: white !important;
        }

        @keyframes shakeRed {
            10%, 90% { transform: translate3d(-2px, 0, 0) scale(1.02); }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(1.02); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.02); }
            40%, 60% { transform: translate3d(6px, 0, 0) scale(1.02); }
        }

        .btn-shake-green {
            animation: shakeGreen 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8) !important;
            color: white !important;
        }

        @keyframes shakeGreen {
            0% { transform: scale(1); }
            30% { transform: scale(1.15) rotate(3deg); }
            50% { transform: scale(1.1) rotate(-3deg); }
            70% { transform: scale(1.12) rotate(2deg); }
            100% { transform: scale(1); }
        }

        .letter-slot {
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .letter-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: manipulation;
        }

        .letter-btn:hover {
            transform: translateY(-3px) scale(1.05);
        }

        .letter-btn:active {
            transform: translateY(0) scale(0.95);
        }
    </style>
</head>

    <script>
        /* ==========================================
           1. منطق الواجهة الرئيسية والمغلف
           ========================================== */
        const text = "أهلاً بالعلوية رتاج، هناك هدية بانتظارك، ولكن حتى تصلين إلى الهدية يجب اجتياز ثلاث مراحل صعبة وخيرة حتى تصل الأميرة إلى قصرها...";
        let index = 0;
        const speed = 45; 
        let isOpened = false;

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    document.getElementById("envelope").classList.add("hide-envelope");
                }, 2000);
            }
        }

        const envelope = document.getElementById("envelope");

        envelope.addEventListener("click", (e) => {
            // منع فتح المغلف عند الضغط على أزرار الألغاز نفسها
            if(e.target.classList.contains('small-btn')) return;

            if (!isOpened) {
                isOpened = true;
                envelope.classList.add("open");
                setTimeout(typeWriter, 800);
            }
        });

        /* ==========================================
           2. الربط بين الصفحة الرئيسية واللغز
           ========================================== */
        const puzzle1Btn = document.getElementById('puzzle1Btn');
        const puzzleModal = document.getElementById('puzzleModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        puzzle1Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            initGame();
            puzzleModal.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            puzzleModal.classList.remove('active');
        });

        /* ==========================================
           3. منطق اللغز الأول (ترتيب الحروف)
           ========================================== */
        const WORD1_TARGET = ['ع', 'ل', 'و', 'ي', 'ت', 'ي'];
        const WORD2_TARGET = ['ر', 'ت', 'ا', 'ج'];
        const ALL_LETTERS = [...WORD1_TARGET, ...WORD2_TARGET];

        let currentWord1 = new Array(6).fill(null);
        let currentWord2 = new Array(4).fill(null);
        let availablePool = [];

        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.setValueAtTime(130, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.25);
                });
            }
        }

        const soundFX = new SoundFX();

        const word1Container = document.getElementById('word1Container');
        const word2Container = document.getElementById('word2Container');
        const lettersBank = document.getElementById('lettersBank');
        const finishBtn = document.getElementById('finishBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tvScreen = document.getElementById('tvScreen');
        const screenOffContent = document.getElementById('screenOffContent');
        const screenOnContent = document.getElementById('screenOnContent');
        
        const bearContainer = document.getElementById('bearContainer');
        const eyesNeutral = document.getElementById('eyesNeutral');
        const eyesSad = document.getElementById('eyesSad');
        const eyesHappy = document.getElementById('eyesHappy');
        const mouthNeutral = document.getElementById('mouthNeutral');
        const mouthSad = document.getElementById('mouthSad');
        const mouthHappy = document.getElementById('mouthHappy');
        const bearSpeech = document.getElementById('bearSpeech');
        const antennaBall = document.getElementById('antennaBall');

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            currentWord1 = new Array(6).fill(null);
            currentWord2 = new Array(4).fill(null);
            
            availablePool = shuffleArray(ALL_LETTERS).map((char, index) => ({
                id: `char-${index}-${Date.now()}`,
                char: char
            }));

            setBearState('neutral');
            resetScreen();
            resetButtonStyles();
            renderBoard();
        }

        function renderBoard() {
            word1Container.innerHTML = '';
            currentWord1.forEach((item, index) => {
                const slot = createSlotElement(item, () => removeLetterFromWord(1, index));
                word1Container.appendChild(slot);
            });

            word2Container.innerHTML = '';
            currentWord2.forEach((item, index) => {
                const slot = createSlotElement(item, () => removeLetterFromWord(2, index));
                word2Container.appendChild(slot);
            });

            lettersBank.innerHTML = '';
            availablePool.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn bg-white hover:bg-sky-50 text-sky-700 font-extrabold text-lg md:text-xl w-10 h-10 md:w-12 md:h-12 rounded-xl border-2 border-sky-200 shadow-sm flex items-center justify-center cursor-pointer';
                btn.innerText = item.char;
                btn.onclick = () => {
                    soundFX.playTap();
                    addLetterToNextAvailable(item);
                };
                lettersBank.appendChild(btn);
            });
        }

        function createSlotElement(item, onClick) {
            const slot = document.createElement('div');
            slot.className = 'letter-slot w-10 h-10 md:w-11 md:h-11 rounded-xl border-2 border-sky-300/60 bg-white/60 flex items-center justify-center';
            
            if (item) {
                const letterBtn = document.createElement('button');
                letterBtn.className = 'letter-btn bg-sky-500 text-white font-extrabold text-lg md:text-xl w-full h-full rounded-lg shadow-sm flex items-center justify-center cursor-pointer';
                letterBtn.innerText = item.char;
                letterBtn.onclick = () => {
                    soundFX.playTap();
                    onClick();
                };
                slot.appendChild(letterBtn);
            }
            return slot;
        }

        function addLetterToNextAvailable(item) {
            const emptyW1Index = currentWord1.findIndex(slot => slot === null);
            if (emptyW1Index !== -1) {
                currentWord1[emptyW1Index] = item;
                availablePool = availablePool.filter(p => p.id !== item.id);
                renderBoard();
                return;
            }

            const emptyW2Index = currentWord2.findIndex(slot => slot === null);
            if (emptyW2Index !== -1) {
                currentWord2[emptyW2Index] = item;
                availablePool = availablePool.filter(p => p.id !== item.id);
                renderBoard();
                return;
            }
        }

        function removeLetterFromWord(wordNumber, index) {
            let item = null;
            if (wordNumber === 1) {
                item = currentWord1[index];
                currentWord1[index] = null;
            } else {
                item = currentWord2[index];
                currentWord2[index] = null;
            }

            if (item) {
                availablePool.push(item);
                renderBoard();
            }
        }

        function setBearState(state) {
            bearContainer.classList.remove('bear-sad', 'bear-happy');
            eyesNeutral.classList.add('hidden');
            eyesSad.classList.add('hidden');
            eyesHappy.classList.add('hidden');
            mouthNeutral.classList.add('hidden');
            mouthSad.classList.add('hidden');
            mouthHappy.classList.add('hidden');

            if (state === 'sad') {
                bearContainer.classList.add('bear-sad');
                eyesSad.classList.remove('hidden');
                mouthSad.classList.remove('hidden');
                bearSpeech.innerText = "أوووه! الترتيب غير صحيح 😢 جرب ثانية!";
                bearSpeech.className = "bg-rose-50 border border-rose-200 text-rose-700 text-xs md:text-sm font-bold px-4 py-1.5 rounded-full shadow-sm animate-bounce";
                antennaBall.setAttribute('fill', '#ef4444');
            } else if (state === 'happy') {
                bearContainer.classList.add('bear-happy');
                eyesHappy.classList.remove('hidden');
                mouthHappy.classList.remove('hidden');
                bearSpeech.innerText = "ممتاز جداً! الشاشة اشتغلت 🎉 أحسنت!";
                bearSpeech.className = "bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs md:text-sm font-bold px-4 py-1.5 rounded-full shadow-sm";
                antennaBall.setAttribute('fill', '#10b981');
            } else {
                eyesNeutral.classList.remove('hidden');
                mouthNeutral.classList.remove('hidden');
                bearSpeech.innerText = "رتب الحروف لأستعيد تشغيل الشاشة! 🤖";
                bearSpeech.className = "bg-white/90 border border-sky-200 text-sky-900 text-xs md:text-sm font-bold px-4 py-1.5 rounded-full shadow-sm";
                antennaBall.setAttribute('fill', '#38bdf8');
            }
        }

        function activateScreen() {
            tvScreen.classList.remove('broken');
            tvScreen.classList.add('active');
            screenOffContent.classList.add('hidden');
            screenOnContent.classList.remove('hidden');
        }

        function resetScreen() {
            tvScreen.classList.remove('active');
            tvScreen.classList.add('broken');
            screenOffContent.classList.remove('hidden');
            screenOnContent.classList.add('hidden');
        }

        function resetButtonStyles() {
            finishBtn.className = "w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-sky-400 to-sky-500 hover:from-sky-500 hover:to-sky-600 text-white font-black text-base rounded-2xl shadow-lg shadow-sky-300/50 transform active:scale-95 transition-all duration-200 flex items-center justify-center gap-2";
        }

        function checkAnswer() {
            resetButtonStyles();

            const userWord1 = currentWord1.map(i => i ? i.char : '').join('');
            const userWord2 = currentWord2.map(i => i ? i.char : '').join('');

            const target1 = WORD1_TARGET.join('');
            const target2 = WORD2_TARGET.join('');

            const isCorrect = (userWord1 === target1) && (userWord2 === target2);

            if (isCorrect) {
                soundFX.playSuccess();
                setBearState('happy');
                activateScreen();
                finishBtn.classList.add('btn-shake-green');

                if (window.confetti) {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }

                // العودة التلقائية للشاشة الرئيسية بعد 3 ثوانٍ من النجاح
                setTimeout(() => {
                    puzzleModal.classList.remove('active');
                }, 3000);

            } else {
                soundFX.playError();
                setBearState('sad');
                resetScreen();
                finishBtn.classList.add('btn-shake-red');

                setTimeout(() => {
                    finishBtn.classList.remove('btn-shake-red');
                }, 700);
            }
        }

        finishBtn.addEventListener('click', checkAnswer);
        resetBtn.addEventListener('click', () => {
            soundFX.playTap();
            initGame();
        });
    </script>
</body>
</html>
