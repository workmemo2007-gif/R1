<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور المتحركة | Animated GIF Gallery</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        /* شريط التصفية */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* شبكة الصور */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gif-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gif-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(99, 102, 241, 0.3);
        }

        .gif-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .gif-info {
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
        }

        /* نافذة العرض المكبرة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>مكتبة الصور المتحركة</h1>
        <p>اختر التصنيف أو اضغط على الصورة لمشاهدتها بالحجم الكامل</p>
    </header>

    <!-- أزرار التصفية -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGifs('all')">الكل</button>
        <button class="filter-btn" onclick="filterGifs('nature')">طبيعة</button>
        <button class="filter-btn" onclick="filterGifs('tech')">تكنولوجيا</button>
        <button class="filter-btn" onclick="filterGifs('funny')">مضحك</button>
    </div>

    <!-- معرض الصور -->
    <div class="gallery-grid" id="gallery">
        <!-- عنصر صورة 1 -->
        <div class="gif-card" data-category="nature" onclick="openModal(this)">
            <img src="https://media.giphy.com/media/26brvQnj4v5Bv82Fi/giphy.gif" alt="طبيعة">
            <div class="gif-info">شلالات طبيعية</div>
        </div>

        <!-- عنصر صورة 2 -->
        <div class="gif-card" data-category="tech" onclick="openModal(this)">
            <img src="https://media.giphy.com/media/l3vhFAJ43M2RGCy40/giphy.gif" alt="تكنولوجيا">
            <div class="gif-info">برمجة وكود</div>
        </div>

        <!-- عنصر صورة 3 -->
        <div class="gif-card" data-category="funny" onclick="openModal(this)">
            <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="مضحك">
            <div class="gif-info">قطة متحركة</div>
        </div>

        <!-- عنصر صورة 4 -->
        <div class="gif-card" data-category="nature" onclick="openModal(this)">
            <img src="https://media.giphy.com/media/3o7qE1YN7aBOFPRw8E/giphy.gif" alt="طبيعة">
            <div class="gif-info">غابة مطيرة</div>
        </div>
    </div>

    <!-- نافذة العرض المكبرة -->
    <div class="modal" id="gifModal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="fullImg">
    </div>

    <script>
        // تصفية الصور حسب التصنيف
        function filterGifs(category) {
            const cards = document.querySelectorAll('.gif-card');
            const buttons = document.querySelectorAll('.filter-btn');

            // تحديث زر التصنيف النشط
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // إخفاء وإظهار الكروت
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // فتح الصورة المكبرة
        function openModal(card) {
            const modal = document.getElementById('gifModal');
            const fullImg = document.getElementById('fullImg');
            const imgSrc = card.querySelector('img').src;

            fullImg.src = imgSrc;
            modal.style.display = 'flex';
        }

        // إغلاق النافذة المكبرة
        function closeModal() {
            document.getElementById('gifModal').style.display = 'none';
        }
    </script>
</body>
</html>
