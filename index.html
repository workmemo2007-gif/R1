<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* وضع الكارت في المنطقة السفلى */
            background-color: #000000;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        /* تصميم كارت الزجاج السائل مصغر وشفاف بنسبة 90% */
        .glass-card {
            position: relative;
            z-index: 3;
            width: 85%;
            max-width: 340px; /* تصغير حجم الكارت */
            padding: 18px 20px; /* تقليل الحشوة الداخلية */
            margin-bottom: 25px; /* إزاحة قصيرة عن الحافة السفلى */
            border-radius: 20px;
            
            /* شفافية 90% (خلفية بنسبة 10% فقط) */
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(10px) saturate(160%);
            -webkit-backdrop-filter: blur(10px) saturate(160%);
            
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 20px 45px rgba(0, 0, 0, 0.6),
                inset 0 0 15px rgba(255, 255, 255, 0.25);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .user-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .thuluth-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        /* خط واضح وصغير يظهر بنمط آلة كاتبة/كيبورد */
        .typing-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            text-align: right;
            border-left: 2px solid #ffffff; /* المؤشر النابض */
            white-space: pre-wrap;
            overflow: hidden;
            display: inline-block;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffffff; }
        }

        .glass-btn {
            display: block;
            width: 100%;
            padding: 9px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background 0.3s ease, border-color 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/workmemo2007-gif/R1/0d60df8b2327c8cb790f747c425956b407036370/lv_0_%D9%A2%D9%A0%D9%A2%D9%A6%D9%A0%D9%A9%D9%A2%D9%A2%D9%A2%D9%A1%D9%A3%D9%A5%D9%A1%D9%A4.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="overlay"></div>

    <div class="glass-card">
        <div class="card-header">
            <img src="https://via.placeholder.com/60" alt="صورة المستلم" class="user-img">
            <h1 class="thuluth-title">أهلاً بك</h1>
        </div>
        
        <p class="typing-text" id="typewriter"></p>

        <button class="glass-btn">عرض التفاصيل</button>
    </div>

    <script>
        // تأثير طباعة الكيبورد الحية
        const text = "اهلا بالعلويه رتاج هناك هديه بانتظارك لكن حتى تصلين الى الهديه يجب اجتياز ثلاث مراحل صعبه و خطيره حتى تصل الاميره الى قصرها";
        let index = 0;
        const speed = 50; // السرعة بالميللي ثانية

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        window.onload = typeWriter;
    </script>
</body>
</html>
