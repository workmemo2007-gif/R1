<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية والألغاز - علويتي رتاج</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #030712;
            user-select: none;
            touch-action: none;
            position: relative;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* كانفاس تساقط الورد والبتلات المستمر */
        #petalsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* حاوية المغلف الرئيسي للتجاوب والحجم */
        .envelope-container {
            position: relative;
            z-index: 10;
            cursor: pointer;
        }

        /* تصميم كارت الزجاج اللامع - تم تطويل الكارت وتكييفه للازرار */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 2px solid rgba(186, 230, 253, 0.9);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.9);
            color: #0369a1;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-cover {
            width: 100%;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
            background: rgba(224, 242, 254, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .typing-container {
            padding: 0 2px;
            min-height: 65px;
        }

        .typing-text {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1.45;
            color: #0369a1;
            margin-bottom: 2px;
            text-align: right;
            border-left: 2px solid #0284c7;
            white-space: pre-wrap;
            display: inline;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #0284c7; }
        }

        .games-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 10px;
        }

        .small-btn {
            flex: 1;
            padding: 6px 0;
            font-size: 0.58rem;
            font-weight: 800;
            color: #0284c7;
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #7dd3fc;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
            position: relative;
            overflow: hidden;
        }

        .small-btn:hover {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        /* المودالات باللون الأبيض والأزرق الناصع */
        .puzzle-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .puzzle-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .glass-panel-white {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 2px solid #7dd3fc;
            border-left: 1.5px solid #bae6fd;
            border-right: 1.5px solid #bae6fd;
            border-bottom: none;
            box-shadow: 0 -10px 40px rgba(2, 132, 199, 0.25), 0 -2px 15px rgba(245, 158, 11, 0.2);
            border-radius: 28px 28px 0 0;
            width: 100vw;
            height: 58vh;
            padding: 1.25rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            scrollbar-width: none;
            color: #0369a1;
        }

        .puzzle-modal.active .glass-panel-white {
            transform: translateY(0);
        }

        .holo-screen-white {
            background: rgba(224, 242, 254, 0.8);
            border: 1.5px solid #38bdf8;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .pixel-robot-box {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #38bdf8;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pixel-art {
            image-rendering: pixelated;
        }

        .floating-answer {
            display: inline-block;
            animation: bounceAndMove 4s ease-in-out infinite alternate;
            color: #0284c7;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        @keyframes bounceAndMove {
            0% { transform: translate(-3%, -2%) scale(1); }
            100% { transform: translate(3%, 2%) scale(1.03); }
        }

        .glass-btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid #38bdf8;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
        }

        .glass-btn-secondary {
            background: rgba(240, 249, 255, 0.9);
            border: 1.5px solid #7dd3fc;
            color: #0369a1;
            transition: all 0.3s ease;
        }

        .btn-shake-red {
            animation: shakeRed 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            color: #ffffff !important;
        }

        @keyframes shakeRed {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .btn-shake-green {
            animation: shakeGreen 0.6s cubic-bezier(.36,.07,.19,.97) both;
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: #ffffff !important;
        }

        .letter-btn {
            background: #ffffff;
            border: 1.5px solid #7dd3fc;
            color: #0284c7;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.15);
        }

        .letter-slot-mini {
            width: 28px;
            height: 32px;
            background: rgba(224, 242, 254, 0.5);
            border: 1.5px dashed #38bdf8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .glass-tile {
            background: #ffffff;
            border: 1.5px solid #bae6fd;
            transition: all 0.25s ease;
        }

        .selected-tile {
            border-color: #d97706 !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.8) !important;
            transform: scale(0.96);
        }

        #puzzle3Canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 40;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #puzzle3Canvas.active {
            opacity: 1;
            pointer-events: auto;
        }

        .p3-instruction-badge {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid #38bdf8;
            color: #0369a1;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .p3-instruction-badge.active {
            opacity: 1;
        }

        /* إخفاء المغلف نهائياً عند اللعبة الثالثة */
        .hide-completely {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.5) !important;
        }
    </style>
</head>

    <canvas id="puzzle3Canvas"></canvas>

    <script>
        /* --- 1. تأثير تساقط الورود الناعمة المتوهجة --- */
        const petalsCanvas = document.getElementById('petalsCanvas');
        const pCtx = petalsCanvas.getContext('2d');
        let petals = [];

        function resizePetalCanvas() {
            petalsCanvas.width = window.innerWidth;
            petalsCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizePetalCanvas);
        resizePetalCanvas();

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * petalsCanvas.width;
                this.y = -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.2 + 0.8;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.isBlue = Math.random() > 0.4;
                this.color = this.isBlue ? 'rgba(186, 230, 253, 0.85)' : 'rgba(255, 255, 255, 0.9)';
                this.glow = this.isBlue ? 'rgba(56, 189, 248, 0.6)' : 'rgba(255, 255, 255, 0.8)';
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y > petalsCanvas.height + 20) {
                    this.reset();
                }
            }
            draw() {
                pCtx.save();
                pCtx.translate(this.x, this.y);
                pCtx.rotate(this.rotation);
                pCtx.beginPath();
                pCtx.moveTo(0, 0);
                pCtx.bezierCurveTo(-this.size, -this.size, -this.size, this.size, 0, this.size * 1.5);
                pCtx.bezierCurveTo(this.size, this.size, this.size, -this.size, 0, 0);
                pCtx.fillStyle = this.color;
                pCtx.shadowColor = this.glow;
                pCtx.shadowBlur = 10;
                pCtx.fill();
                pCtx.restore();
            }
        }

        for (let i = 0; i < 40; i++) {
            petals.push(new Petal());
        }

        function animatePetals() {

        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playPop() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.setValueAtTime(130, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.09);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.09 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.09);
                    osc.stop(this.ctx.currentTime + idx * 0.09 + 0.25);
                });
            }
        }

            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {

            }

            return slot;

        function addLetterToNextAvailable(item) {
            const emptyW1Index = currentWord1.findIndex(slot => slot === null);
            if (emptyW1Index !== -1) {
                currentWord1[emptyW1Index] = item;
                availablePool = availablePool.filter(p => p.id !== item.id);
                renderP1Board();

                availablePool = availablePool.filter(p => p.id !== item.id);
                renderP1Board();
                return;

        const canvas = document.getElementById('puzzle3Canvas');

        const p3Count = document.getElementById('p3Count');

        let p3Active = false;

        let isDragging = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        class HeartBalloon {
            constructor() {
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = canvas.height + Math.random() * 200 + 50;
                this.size = Math.random() * 12 + 28; 
                this.speedY = Math.random() * 1.5 + 1.2;
                this.floatAmp = Math.random() * 2 + 1;
                this.floatAngle = Math.random() * Math.PI * 2;
                this.hue = 190 + Math.random() * 30;
                this.color = `hsla(${this.hue}, 90%, 65%, 0.8)`;
                this.popped = false;
            }

            update() {
                this.y -= this.speedY;
                this.floatAngle += 0.03;
                this.x += Math.sin(this.floatAngle) * this.floatAmp;

                if (this.y < -80) {
                    this.y = canvas.height + 60;
                    this.x = Math.random() * (canvas.width - 100) + 50;
                }
            }

            draw() {
                if (this.popped) return;
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.beginPath();
                ctx.moveTo(0, this.size);
                ctx.quadraticCurveTo(5, this.size + 15, 0, this.size + 30);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.beginPath();
                const topCurveHeight = this.size * 0.3;
                ctx.moveTo(0, topCurveHeight);
                ctx.bezierCurveTo(0, 0, -this.size, 0, -this.size, topCurveHeight);
                ctx.bezierCurveTo(-this.size, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size * 1.25);
                ctx.bezierCurveTo(0, this.size, this.size, (this.size + topCurveHeight) / 2, this.size, topCurveHeight);
                ctx.bezierCurveTo(this.size, 0, 0, 0, 0, topCurveHeight);
                ctx.closePath();

                ctx.fillStyle = this.color;
                ctx.shadowColor = 'rgba(56, 189, 248, 0.6)';
                ctx.shadowBlur = 15;
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(-this.size * 0.35, topCurveHeight * 0.8, this.size * 0.22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = `900 ${Math.floor(this.size * 0.55)}px Tajawal`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('رتاج', 0, this.size * 0.5);

                ctx.restore();
            }
        }

        class Arrow {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.length = 45;
                this.angle = Math.atan2(vy, vx);
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle = Math.atan2(this.vy, this.vx);

                if (this.x < -100 || this.x > canvas.width + 100 || this.y < -100 || this.y > canvas.height + 100) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.beginPath();
                ctx.moveTo(-this.length, 0);
                ctx.lineTo(0, 0);
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 8;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-12, -7);
                ctx.lineTo(-8, 0);
                ctx.lineTo(-12, 7);
                ctx.closePath();
                ctx.fillStyle = '#d97706';
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 10;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-this.length, 0);
                ctx.lineTo(-this.length - 8, -6);
                ctx.lineTo(-this.length - 4, 0);
                ctx.lineTo(-this.length - 8, 6);
                ctx.closePath();
                ctx.fillStyle = '#38bdf8';
                ctx.fill();

                ctx.restore();
            }
        }

        class PopParticle {
            constructor(x, y, isGold = false) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.size = Math.random() * 4 + 2;
                this.color = isGold ? '#f59e0b' : `hsla(${190 + Math.random() * 30}, 100%, 65%, 0.9)`;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            }
        }

            p3Arrows = [];
            p3Particles = [];

            for (let i = 0; i < 10; i++) {
                p3Balloons.push(new HeartBalloon());
            }

            p3Count.innerText = p3Balloons.length;
            p3Loop();
        }

        function createPopParticles(x, y) {
            for (let i = 0; i < 15; i++) {
                p3Particles.push(new PopParticle(x, y, false));
            }
            for (let i = 0; i < 8; i++) {
                p3Particles.push(new PopParticle(x, y, true));
            }
        }

        function p3Loop() {
            if (!p3Active) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            p3Balloons.forEach(b => {
                b.update();
                b.draw();
            });

            p3Arrows.forEach(a => {
                a.update();
                a.draw();

                p3Balloons.forEach(b => {
                    if (!b.popped && a.active) {
                        const dist = Math.hypot(a.x - b.x, a.y - (b.y + b.size * 0.5));
                        if (dist < b.size * 1.1) {
                            b.popped = true;
                            a.active = false;
                            soundFX.playPop();
                            createPopParticles(b.x, b.y + b.size * 0.5);
                        }
                    }
                });
            });

            p3Balloons = p3Balloons.filter(b => !b.popped);
            p3Arrows = p3Arrows.filter(a => a.active);

            p3Particles.forEach(p => {
                p.update();
                p.draw();
            });
            p3Particles = p3Particles.filter(p => p.alpha > 0);

            p3Count.innerText = p3Balloons.length;

            if (isDragging) {
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const angle = Math.atan2(dy, dx);
                const power = Math.min(Math.hypot(dx, dy), 120);

                ctx.save();
                ctx.translate(dragStart.x, dragStart.y);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.arc(0, 0, 35, -Math.PI / 2, Math.PI / 2);
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 8;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -35);
                ctx.lineTo(-power * 0.5, 0);
                ctx.lineTo(0, 35);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-power * 0.5, 0);
                ctx.lineTo(40, 0);
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                ctx.restore();
            }

            if (p3Balloons.length === 0) {
                p3Active = false;
                soundFX.playSuccess();
                p3Badge.innerText = "مبروك! خرقتِ القلوب العشرة بنجاح ✨👑";

                if (window.confetti) {
                    confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
                }

                setTimeout(() => {
                    canvas.classList.remove('active');
                    p3Badge.classList.remove('active');
                    envelopeWrapper.classList.remove('hide-completely');
                }, 2800);
                return;
            }

            p3AnimId = requestAnimationFrame(p3Loop);
        }

        function handlePointerDown(e) {
            if (!p3Active) return;
            isDragging = true;
            dragStart = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
            dragCurrent = { ...dragStart };
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            dragCurrent = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
        }

        function handlePointerUp() {
            if (!isDragging) return;
            isDragging = false;

            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 15) {
                const speed = Math.min(dist * 0.22, 28);
                const angle = Math.atan2(dy, dx);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                p3Arrows.push(new Arrow(dragStart.x, dragStart.y, vx, vy));
                soundFX.playTap();
            }
        }

        window.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        window.addEventListener('touchstart', handlePointerDown);
        window.addEventListener('touchmove', handlePointerMove);
        window.addEventListener('touchend', handlePointerUp);
    </script>
</body>
</html>
