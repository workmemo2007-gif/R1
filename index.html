<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        /* حاوية المغلف الوردي الشفاف */
        .envelope-wrapper {
            position: relative;
            z-index: 3;
            width: 220px;
            height: 130px;
            background-color: rgba(255, 182, 193, 0.25);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.4);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            margin-top: 100px;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.8s ease, background 0.8s ease, border-color 0.8s ease;
        }

        /* غطاء المغلف العلوي الوردي */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-top: 70px solid rgba(255, 182, 193, 0.45);
            transform-origin: top;
            transition: transform 0.6s ease 0.2s, z-index 0.2s ease 0.4s, opacity 0.8s ease;
            z-index: 5;
        }

        /* جيب المغلف السفلي الوردي */
        .envelope-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid rgba(255, 182, 193, 0.3);
            border-right: 110px solid rgba(255, 182, 193, 0.3);
            border-bottom: 65px solid rgba(255, 182, 193, 0.4);
            border-radius: 0 0 8px 8px;
            z-index: 4;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        /* تصميم كارت الزجاج المصغر - أفقياً وبخط أسرع وشفافية عالية */
        .glass-card {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px; /* زيادة العرض ليصبح أفقياً */
            padding: 8px;
            border-radius: 8px;
            
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px) saturate(150%);
            -webkit-backdrop-filter: blur(6px) saturate(150%);
            
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            color: #ffffff;
            
            z-index: 3;
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.6s ease,
                        background 0.3s ease;
        }

        /* انيميشن فتح المغلف */
        .envelope-wrapper.open::before {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .envelope-wrapper.open .glass-card {
            opacity: 1;
            transform: translateX(-50%) translateY(-20px);
            z-index: 6;
        }

        /* مرحلة انبثاق الكارت للأمام واختفاء الظرف */
        .envelope-wrapper.hide-envelope {
            background-color: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .envelope-wrapper.hide-envelope::before,
        .envelope-wrapper.hide-envelope::after {
            opacity: 0;
        }

        .envelope-wrapper.hide-envelope .glass-card {
            transform: translateX(-50%) translateY(10px) scale(1.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.05);
        }

        /* غلاف الكارت - إظهار الصورة بالكامل دون قص */
        .card-cover {
            width: 100%;
            height: 75px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* إظهار الصورة بكامل أبعادها */
            display: block;
        }

        /* حاوية النص والخط الرئيسي */
        .typing-container {
            padding: 0 2px;
            min-height: 38px;
        }

        .typing-text {
            font-family: 'Tajawal', sans-serif; /* خط واصل ورئيسي */
            font-size: 0.52rem;
            font-weight: 500;
            line-height: 1.35;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 2px;
            text-align: right;
            border-left: 1.5px solid #ffffff;
            white-space: pre-wrap;
            display: inline;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffffff; }
        }

        /* أزرار مصغرة مفصولة تماماً أسفل الكارد بشكل أفقي */
        .games-container {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 8px;
        }

        .small-btn {
            flex: 1;
            padding: 4px 0;
            font-size: 0.5rem;
            font-weight: 500;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
        }

        .small-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/workmemo2007-gif/R1/0d60df8b2327c8cb790f747c425956b407036370/lv_0_%D9%A2%D9%A0%D9%A2%D9%A6%D9%A0%D9%A9%D9%A2%D9%A2%D9%A2%D9%A1%D9%A3%D9%A5%D9%A1%D9%A4.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="overlay"></div>

    <div class="envelope-wrapper" id="envelope">
        <div class="glass-card" id="card">
            <div class="card-cover">
                <img src="https://raw.githubusercontent.com/workmemo2007-gif/R1/092a6042ee20ce4084bd4d0f9fd6887320b0bc23/IMG_2536.jpeg" alt="غلاف الكارت" class="cover-img">
            </div>
            
            <div class="typing-container">
                <span class="typing-text" id="typewriter"></span>
            </div>

            <div class="games-container">
                <button class="small-btn">اللغز الأول</button>
                <button class="small-btn">اللغز الثاني</button>
                <button class="small-btn">اللغز الثالث</button>
            </div>
        </div>
    </div>

    <script>
        const text = "أهلاً بالعلوية رتاج، هناك هدية بانتظارك، ولكن حتى تصلين إلى الهدية يجب اجتياز ثلاث مراحل صعبة وخيرة حتى تصل الأميرة إلى قصرها...";
        let index = 0;
        const speed = 45; 
        let isOpened = false;

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    document.getElementById("envelope").classList.add("hide-envelope");
                }, 2000);
            }
        }

        const envelope = document.getElementById("envelope");

        envelope.addEventListener("click", () => {
            if (!isOpened) {
                isOpened = true;
                envelope.classList.add("open");
                setTimeout(typeWriter, 800);
            }
        });
    </script>
</body>
</html>
