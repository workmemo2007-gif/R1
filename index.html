<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        /* تصميم كارت الزجاج */
        .glass-card {
            position: relative;
            z-index: 3;
            width: 85%;
            max-width: 310px;
            padding: 14px;
            border-radius: 24px;
            
            /* تعديل: إنزال الكارت لأسفل قليلاً */
            margin-top: 40px;
            
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px) saturate(200%);
            -webkit-backdrop-filter: blur(12px) saturate(200%);
            
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.08);
            color: #ffffff;
            
            /* إعدادات الظهور السينمائي */
            opacity: 0;
            transform: scale(0.92) translateY(15px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* حالة الظهور السينمائي */
        .glass-card.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .glass-card:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* غلاف الكارت */
        .card-cover {
            width: 100%;
            height: 120px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* حاوية النص */
        .typing-container {
            padding: 0 4px;
            min-height: 80px;
            margin-bottom: 12px;
        }

        .typing-text {
            font-family: 'Amiri', serif;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.7;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            text-align: right;
            border-left: 2px solid #ffffff;
            white-space: pre-wrap;
            display: inline;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffffff; }
        }

        /* حاوية الأزرار المربعة */
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        /* تصميم الزر المربع الزجاجي */
        .square-btn {
            flex: 1;
            aspect-ratio: 1 / 1; /* يضمن شكل مربع متناسق */
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .square-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/workmemo2007-gif/R1/0d60df8b2327c8cb790f747c425956b407036370/lv_0_%D9%A2%D9%A0%D9%A2%D9%A6%D9%A0%D9%A9%D9%A2%D9%A2%D9%A2%D1%A1%D9%A3%D9%A5%D9%A1%D9%A4.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="overlay"></div>

    <div class="glass-card" id="card">
        <div class="card-cover">
            <img src="https://raw.githubusercontent.com/workmemo2007-gif/R1/092a6042ee20ce4084bd4d0f9fd6887320b0bc23/IMG_2536.jpeg" alt="غلاف الكارت" class="cover-img">
        </div>
        
        <div class="typing-container">
            <span class="typing-text" id="typewriter"></span>
        </div>

        <div class="btn-group">
            <button class="square-btn">1</button>
            <button class="square-btn">2</button>
            <button class="square-btn">3</button>
        </div>
    </div>

    <script>
        const text = "أهلاً بالعلوية رتاج، هناك هدية بانتظارك، ولكن حتى تصلين إلى الهدية يجب اجتياز ثلاث مراحل صعبة وخيرة حتى تصل الأميرة إلى قصرها...";
        let index = 0;
        const speed = 45; 

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        window.onload = () => {
            setTimeout(() => {
                const card = document.getElementById("card");
                card.classList.add("show");
                
                setTimeout(typeWriter, 500);
            }, 1000);
        };
    </script>
</body>
</html>
