<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة لإبراز الكارت */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 2;
        }

        /* تصميم كارت الزجاج السائل Liquid Glass مع زيادة الشفافية */
        .glass-card {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 420px;
            padding: 30px 25px;
            border-radius: 24px;
            
            /* زيادة الشفافية (تقليل العتامة إلى 0.03 والـ Blur إلى 8px) */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px) saturate(160%);
            -webkit-backdrop-filter: blur(8px) saturate(160%);
            
            /* حدود مضاءة تعطي إيحاء لمعان الزجاج */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            
            /* ظلال وانعكاسات سائلة */
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
                
            color: #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 0 25px rgba(255, 255, 255, 0.2);
        }

        /* رأس الكارت: الصورة والاسم على اليمين */
        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* اسم المستلم بخط الثلث */
        .thuluth-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .glass-card p {
            font-size: 1rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 25px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.7);
            text-align: right;
        }

        /* زر يتناسب مع تصميم الزجاج */
        .glass-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
