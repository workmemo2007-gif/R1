<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة الرسالة الإلكترونية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* طبقة تظليل سوداء خفيفة لإبراز الكارت */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        /* تصميم كارت الزجاج السائل Liquid Glass */
        .glass-card {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 24px;
            
            /* الشفافية العالية مع التضبيب */
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            
            /* حدود مضاءة تعطي إيحاء لمعان الزجاج */
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            
            /* ظلال وانعكاسات سائلة */
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 0 15px rgba(255, 255, 255, 0.15);
                
            color: #ffffff;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.7),
                inset 0 0 25px rgba(255, 255, 255, 0.25);
        }

        .glass-card h2 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .glass-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        /* زر يتناسب مع تصميم الزجاج */
        .glass-btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/workmemo2007-gif/R1/56d7ea1cec0068c18e3916bcd13c27968bea6308/lv_0_%D9%A2%D9%A0%D9%A2%D9%A6%D9%A0%D9%A9%D9%A2%D9%A2%D9%A1%D9%A6%D9%A4%D9%A3%D9%A1%D9%A1.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="overlay"></div>

    <div class="glass-card">
        <h2>وصلتك رسالة جديدة</h2>
        <p>هذا النص يمثل محتوى الرسالة الإلكترونية المصممة بطابع زجاجي شفاف ومتوهج فوق الفيديو.</p>
        <a href="#" class="glass-btn">قراءة الرسالة</a>
    </div>

</body>
</html>
